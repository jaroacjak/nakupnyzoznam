<!DOCTYPE html>
<html lang="sk">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>🛒 Registrácia – Nákupný kalendár</title>


<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#f2f4f7;
  color:#222;

  font-family:Arial,sans-serif;

  padding:16px;
}

.card{
  width:100%;
  max-width:430px;

  background:#fff;

  border-radius:20px;

  padding:28px;

  box-shadow:0 5px 25px #0001;
}

.logo{
  text-align:center;
  font-size:48px;
  margin-bottom:8px;
}

h1{
  text-align:center;
  margin:0 0 10px;
}

.subtitle{
  text-align:center;
  color:#777;
  margin-bottom:25px;
}

.form{
  display:grid;
  gap:12px;
}

input,
button{
  width:100%;

  font:inherit;

  border-radius:10px;

  padding:12px;

  border:1px solid #ccc;
}

input:focus{
  outline:none;
  border-color:#222;
}

button{
  cursor:pointer;
}

.primary{
  background:#222;
  color:#fff;
  border:0;

  margin-top:5px;
}

.primary:hover{
  opacity:.9;
}

.primary:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  padding:11px;

  border-radius:10px;

  background:#f1f1f1;

  text-align:center;

  margin-bottom:12px;

  font-size:14px;
}

.message.error{
  background:#ffe5e5;
  color:#b00000;
}

.message.success{
  background:#e3f7e8;
  color:#176b2c;
}

.hidden{
  display:none;
}

.login{
  text-align:center;

  margin-top:20px;

  color:#777;
}

.login button{
  width:auto;

  padding:0;

  border:0;

  background:none;

  color:#222;

  font-weight:bold;
}

.note{
  font-size:12px;

  color:#888;

  text-align:center;

  margin-top:18px;

  line-height:1.5;
}

</style>

</head>


<body>


<div class="card">


  <div class="logo">
    🛒
  </div>


  <h1>
    Vytvoriť účet
  </h1>


  <div class="subtitle">
    Zaregistruj sa do nákupného kalendára
  </div>


  <div
    id="message"
    class="message hidden"
  ></div>


  <form
    id="registerForm"
    class="form"
  >


    <input
      id="email"
      type="email"
      placeholder="E-mail"
      autocomplete="email"
      required
    >


    <input
      id="password"
      type="password"
      placeholder="Heslo"
      autocomplete="new-password"
      minlength="6"
      required
    >


    <input
      id="password2"
      type="password"
      placeholder="Zopakuj heslo"
      autocomplete="new-password"
      minlength="6"
      required
    >


    <button
      id="registerButton"
      type="submit"
      class="primary"
    >

      👤 Zaregistrovať sa

    </button>


  </form>



  <div class="login">

    Už máš účet?

    <button
      type="button"
      onclick="goToLogin()"
    >
      Prihlásiť sa
    </button>

  </div>



  <div class="note">

    Po registrácii budeš automaticky
    prihlásený a otvorí sa tvoj
    nákupný kalendár.

  </div>


</div>



<!-- =====================================
     APPWRITE SDK
===================================== -->

<script src="https://cdn.jsdelivr.net/npm/appwrite@17.0.0"></script>



<!-- =====================================
     APPWRITE AUTH.JS
===================================== -->

<script src="js/auth.js"></script>



<script>


/*
=========================================
  ELEMENTY
=========================================
*/

const registerForm =
  document.getElementById(
    "registerForm"
  );


const message =
  document.getElementById(
    "message"
  );


const registerButton =
  document.getElementById(
    "registerButton"
  );



/*
=========================================
  REGISTRÁCIA
=========================================
*/

registerForm.addEventListener(

  "submit",

  async function(event){

    event.preventDefault();


    /*
    -------------------------------------
      E-MAIL
    -------------------------------------
    */

    const email =

      document
        .getElementById(
          "email"
        )
        .value
        .trim()
        .toLowerCase();



    /*
    -------------------------------------
      HESLO
    -------------------------------------
    */

    const password =

      document
        .getElementById(
          "password"
        )
        .value;



    /*
    -------------------------------------
      ZOPAKOVANÉ HESLO
    -------------------------------------
    */

    const password2 =

      document
        .getElementById(
          "password2"
        )
        .value;



    /*
    -------------------------------------
      KONTROLA HESIEL
    -------------------------------------
    */

    if(password !== password2){

      showMessage(
        "Heslá sa nezhodujú.",
        "error"
      );

      return;

    }



    /*
    -------------------------------------
      KONTROLA DĹŽKY HESLA
    -------------------------------------
    */

    if(password.length < 6){

      showMessage(
        "Heslo musí mať aspoň 6 znakov.",
        "error"
      );

      return;

    }



    /*
    -------------------------------------
      KONTROLA APPWRITE
    -------------------------------------
    */

    if(
      typeof registerUser !== "function"
    ){

      showMessage(
        "Chyba: Appwrite sa nepodarilo načítať.",
        "error"
      );

      return;

    }



    /*
    -------------------------------------
      BLOKOVANIE TLAČIDLA
    -------------------------------------
    */

    registerButton.disabled = true;

    registerButton.textContent =
      "⏳ Vytváram účet...";



    showMessage(
      "Registrujem používateľa...",
      ""
    );



    try{


      /*
      -----------------------------------
        REGISTRÁCIA V APPWRITE
      -----------------------------------
      */

      const result =

        await registerUser(
          email,
          email,
          password
        );



      /*
      -----------------------------------
        CHYBA REGISTRÁCIE
      -----------------------------------
      */

      if(!result.success){

        showMessage(
          result.message ||
          "Registrácia sa nepodarila.",
          "error"
        );


        registerButton.disabled = false;

        registerButton.textContent =
          "👤 Zaregistrovať sa";

        return;

      }



      /*
      -----------------------------------
        ÚČET VYTVORENÝ
      -----------------------------------
      */

      showMessage(
        "✅ Účet bol vytvorený. Prihlasujem...",
        "success"
      );



      /*
      -----------------------------------
        AUTOMATICKÉ PRIHLÁSENIE
      -----------------------------------
      */

      const loginResult =

        await loginUser(
          email,
          password
        );



      /*
      -----------------------------------
        AK SA PRIHLÁSENIE NEPODARÍ
      -----------------------------------
      */

      if(!loginResult.success){

        showMessage(
          "Účet bol vytvorený. Teraz sa prosím prihlás.",
          "success"
        );


        setTimeout(

          function(){

            window.location.href =
              "login.html";

          },

          1500

        );


        return;

      }



      /*
      -----------------------------------
        ÚSPEŠNÉ PRIHLÁSENIE
      -----------------------------------
      */

      showMessage(
        "✅ Registrácia úspešná! Otváram aplikáciu...",
        "success"
      );



      /*
      -----------------------------------
        PRESMEROVANIE DO APP
      -----------------------------------
      */

      setTimeout(

        function(){

          window.location.href =
            "app.html";

        },

        1000

      );


    }catch(error){


      console.error(
        "Chyba:",
        error
      );


      showMessage(
        error.message ||
        "Nastala neočakávaná chyba.",
        "error"
      );


      registerButton.disabled = false;

      registerButton.textContent =
        "👤 Zaregistrovať sa";

    }


  }

);



/*
=========================================
  ZOBRAZENIE SPRÁVY
=========================================
*/

function showMessage(
  text,
  type
){

  message.textContent = text;


  message.classList.remove(
    "hidden",
    "error",
    "success"
  );


  if(type){

    message.classList.add(
      type
    );

  }

}



/*
=========================================
  PRECHOD NA PRIHLÁSENIE
=========================================
*/

function goToLogin(){

  window.location.href =
    "login.html";

}



/*
=========================================
  KONTROLA PRIHLÁSENIA
=========================================
*/

async function checkAlreadyLoggedIn(){

  try{


    if(
      typeof getCurrentUser !== "function"
    ){

      return;

    }


    const user =

      await getCurrentUser();



    if(user){

      window.location.href =
        "app.html";

    }


  }catch(error){

    console.log(
      "Používateľ nie je prihlásený."
    );

  }

}


checkAlreadyLoggedIn();


</script>


</body>

</html>
