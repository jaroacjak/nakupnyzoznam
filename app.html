<!DOCTYPE html>
<html lang="sk">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>🛒 Nákupný kalendár</title>


<link
  rel="stylesheet"
  href="css/style.css"
>


<!-- =====================================================
     LEAFLET MAPA
===================================================== -->

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>


<style>

/* =====================================================
   MAPA
===================================================== */

#map{

  width:100%;

  height:500px;

  border-radius:18px;

  margin-top:15px;

  border:1px solid #ddd;

}


/* =====================================================
   OVLÁDANIE MAPY
===================================================== */

.map-controls{

  display:flex;

  flex-wrap:wrap;

  gap:8px;

  margin-top:12px;

}


.map-controls button{

  flex:1;

  min-width:140px;

}


/* =====================================================
   INFORMÁCIE MAPY
===================================================== */

.map-info{

  margin-top:12px;

  padding:12px;

  border-radius:12px;

  background:#f1f1f1;

}


.selected-map-store{

  display:none;

  margin-top:10px;

  padding:12px;

  border-radius:12px;

  background:#eaf7ea;

}


/* =====================================================
   FILTRE OBCHODOV
===================================================== */

.store-filters{

  display:flex;

  flex-wrap:wrap;

  gap:7px;

  margin-top:12px;

}


.store-filter{

  background:#eee;

  border:0;

}


.store-filter.active{

  background:#222;

  color:#fff;

}


/* =====================================================
   ZOZNAM OBCHODOV
===================================================== */

.nearby-stores{

  display:grid;

  gap:8px;

  margin-top:15px;

}


.nearby-store{

  display:flex;

  align-items:center;

  gap:10px;

  padding:12px;

  border:1px solid #ddd;

  border-radius:12px;

  background:#fafafa;

}


.nearby-store-info{

  flex:1;

}


.nearby-store-name{

  font-weight:bold;

}


.nearby-store-distance{

  color:#777;

  font-size:13px;

  margin-top:3px;

}


/* =====================================================
   POUŽÍVATEĽ
===================================================== */

.user-bar{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:10px;

  margin-bottom:15px;

}


.user-name{

  font-weight:bold;

}


/* =====================================================
   MOBIL
===================================================== */

@media(max-width:600px){

  #map{

    height:380px;

  }


  .map-controls{

    display:grid;

    grid-template-columns:1fr 1fr;

  }


  .map-controls button{

    min-width:0;

  }


  .store-filters{

    display:grid;

    grid-template-columns:1fr 1fr;

  }


  .user-bar{

    align-items:flex-start;

    flex-direction:column;

  }

}

</style>

</head>


<body>


<div class="app">


<!-- =====================================================
     DÁTUMY
===================================================== -->

<section
  id="datesPage"
  class="card"
>


<div class="user-bar">


  <div class="user-name">

    👤

    <span id="currentUser">
      Používateľ
    </span>

  </div>


  <button
    class="secondary"
    onclick="logoutUser()"
  >

    🚪 Odhlásiť sa

  </button>


</div>


<h1>

  🛒 Nákupný kalendár

</h1>


<!-- PRIDAŤ DÁTUM -->

<div class="date-add">


  <input
    id="newDate"
    type="date"
  >


  <button
    class="primary"
    onclick="addDate()"
  >

    + Pridať dátum

  </button>


</div>


<h2>

  📅 Všetky dátumy

</h2>


<div
  id="dateList"
  class="date-list"
></div>


<div class="note">

  Všetko sa automaticky ukladá
  v tomto prehliadači.

</div>


</section>



<!-- =====================================================
     MAPA OBCHODOV
===================================================== -->

<section class="card">


<h2>

  🗺️ Mapa predajní

</h2>


<p class="meta">

  Na mape môžeš vyhľadať predajne
  a vybrať si obchod pre svoj nákup.

</p>


<!-- =====================================================
     TLAČIDLÁ
===================================================== -->

<div class="map-controls">


  <button
    class="primary"
    onclick="mojaPoloha()"
  >

    📍 Moja poloha

  </button>


  <button
    class="secondary"
    onclick="showSlovakia()"
  >

    🇸🇰 Celé Slovensko

  </button>


  <button
    class="secondary"
    onclick="findNearbyStores()"
  >

    🔎 Obchody v okolí

  </button>


</div>



<!-- =====================================================
     FILTRE
===================================================== -->

<h3>

  🏪 Vyber obchod

</h3>


<div class="store-filters">


  <button
    class="store-filter active"
    onclick="filterStores('all')"
  >

    🏪 Všetky

  </button>


  <button
    class="store-filter"
    onclick="filterStores('Lidl')"
  >

    🛒 Lidl

  </button>


  <button
    class="store-filter"
    onclick="filterStores('COOP')"
  >

    🛒 COOP Jednota

  </button>


  <button
    class="store-filter"
    onclick="filterStores('Kaufland')"
  >

    🛒 Kaufland

  </button>


  <button
    class="store-filter"
    onclick="filterStores('Tesco')"
  >

    🛒 Tesco

  </button>


  <button
    class="store-filter"
    onclick="filterStores('Billa')"
  >

    🛒 Billa

  </button>


  <button
    class="store-filter"
    onclick="filterStores('Terno')"
  >

    🛒 Terno

  </button>


  <button
    class="store-filter"
    onclick="filterStores('Penny')"
  >

    🛒 Penny

  </button>


  <button
    class="store-filter"
    onclick="filterStores('other')"
  >

    🏪 Ostatné

  </button>


</div>



<!-- =====================================================
     INFO
===================================================== -->

<div
  id="mapInfo"
  class="map-info"
>

  🗺️ Vyber „Celé Slovensko“
  alebo „Moja poloha“.

</div>



<!-- =====================================================
     VYBRANÝ OBCHOD
===================================================== -->

<div
  id="selectedMapStore"
  class="selected-map-store"
></div>



<!-- =====================================================
     MAPA
===================================================== -->

<div id="map"></div>



<!-- =====================================================
     ZOZNAM OBCHODOV
===================================================== -->

<div
  id="nearbyStores"
  class="nearby-stores"
></div>


</section>



<!-- =====================================================
     DETAIL NÁKUPNÉHO DŇA
===================================================== -->

<section
  id="shoppingPage"
  class="card hidden"
>


<div class="user-bar">


  <div class="user-name">

    👤

    <span id="shoppingUser">
      Používateľ
    </span>

  </div>


  <button
    class="secondary"
    onclick="logoutUser()"
  >

    🚪 Odhlásiť sa

  </button>


</div>



<!-- SPÄŤ -->

<button
  class="back"
  onclick="showDates()"
>

  ← Späť na dátumy

</button>



<!-- DÁTUM -->

<div
  id="selectedDate"
  class="selected-date"
></div>



<!-- =====================================================
     OBCHODY
===================================================== -->

<h2>

  🏪 Obchod

</h2>


<div
  id="stores"
  class="stores"
></div>


<h3
  id="shopTitle"
  class="shop-title"
></h3>



<!-- =====================================================
     PRIDAŤ POLOŽKU
===================================================== -->

<div class="add-item">


  <input
    id="itemName"
    placeholder="Čo treba kúpiť?"
  >


  <input
    id="itemQty"
    type="number"
    min="1"
    value="1"
  >


  <button
    class="primary"
    onclick="addItem()"
  >

    + Pridať

  </button>


</div>



<!-- =====================================================
     POLOŽKY
===================================================== -->

<div
  id="itemList"
></div>



<!-- =====================================================
     SPODOK
===================================================== -->

<div class="bottom">


  <span
    id="itemCount"
  ></span>


  <button
    class="danger"
    onclick="clearBought()"
  >

    Vymazať kúpené

  </button>


</div>


</section>


</div>



<!-- =====================================================
     LEAFLET
===================================================== -->

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>



<!-- =====================================================
     AUTH
===================================================== -->

<script
  src="js/auth.js">
</script>



<!-- =====================================================
     APP
===================================================== -->

<script
  src="js/app.js">
</script>



<!-- =====================================================
     MAP
===================================================== -->

<script
  src="js/map.js">
</script>



<script>

/* =====================================================
   KONTROLA PRIHLÁSENIA
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    if(
      typeof getCurrentUser ===
      "function"
    ){

      const user =
        getCurrentUser();


      if(!user){

        window.location.href =
          "login.html";

        return;

      }


      const currentUser =
        document.getElementById(
          "currentUser"
        );


      const shoppingUser =
        document.getElementById(
          "shoppingUser"
        );


      if(currentUser){

        currentUser.textContent =
          user;

      }


      if(shoppingUser){

        shoppingUser.textContent =
          user;

      }

    }


    /* Dnešný dátum */

    const dateInput =
      document.getElementById(
        "newDate"
      );


    if(
      dateInput &&
      !dateInput.value
    ){

      dateInput.value =
        new Date()
          .toISOString()
          .slice(0,10);

    }

  }
);


/* =====================================================
   ODHLÁSENIE
===================================================== */

function logoutUser(){

  if(
    typeof logout ===
    "function"
  ){

    logout();

    return;

  }


  localStorage.removeItem(
    "loggedInUser"
  );

  localStorage.removeItem(
    "currentUser"
  );

  localStorage.removeItem(
    "user"
  );


  window.location.href =
    "index.html";

}


/* =====================================================
   OCHRANA APP.HTML
===================================================== */

window.addEventListener(
  "pageshow",
  function(){

    if(
      typeof getCurrentUser ===
      "function"
    ){

      if(!getCurrentUser()){

        window.location.href =
          "login.html";

      }

    }

  }
);

</script>


</body>

</html>
