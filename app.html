<!DOCTYPE html>
<html lang="sk">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>🛒 Nákupný kalendár</title>


<link
  rel="stylesheet"
  href="css/style.css"
>


<!-- Leaflet mapa -->

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>


<style>

#map{
  width:100%;
  height:420px;
  border-radius:16px;
  margin-top:15px;
}


.map-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px;
}


.map-buttons button{
  flex:1;
  min-width:130px;
}


.selected-store{
  margin-top:12px;
  padding:12px;
  border-radius:12px;
  background:#f1f1f1;
}


.nearby-stores{
  display:grid;
  gap:8px;
  margin-top:15px;
}


.nearby-store{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px;
  border:1px solid #ddd;
  border-radius:12px;
  background:#fafafa;
}


.nearby-store-info{
  flex:1;
}


.nearby-store-name{
  font-weight:bold;
}


.nearby-store-distance{
  color:#777;
  font-size:13px;
  margin-top:4px;
}


.user-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:15px;
}


.user-name{
  font-weight:bold;
}


@media(max-width:600px){

  #map{
    height:330px;
  }


  .map-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
  }


  .map-buttons button{
    min-width:0;
  }


  .user-bar{
    align-items:flex-start;
    flex-direction:column;
  }

}

</style>

</head>


<body>


<div class="app">


<!-- ==================================================
     NÁKUPNÝ KALENDÁR
================================================== -->

<section
  id="datesPage"
  class="card"
>


<!-- PRIHLÁSENÝ POUŽÍVATEĽ -->

<div class="user-bar">

  <div class="user-name">

    👤
    <span id="currentUser">
      Používateľ
    </span>

  </div>


  <button
    class="secondary"
    onclick="logoutUser()"
  >
    🚪 Odhlásiť sa
  </button>

</div>


<h1>
  🛒 Nákupný kalendár
</h1>


<!-- PRIDAŤ DÁTUM -->

<div class="date-add">

  <input
    id="newDate"
    type="date"
  >


  <button
    class="primary"
    onclick="addDate()"
  >
    + Pridať dátum
  </button>

</div>


<h2>
  📅 Všetky dátumy
</h2>


<div
  id="dateList"
  class="date-list"
></div>


<div class="note">

  Všetko sa automaticky ukladá
  v tomto prehliadači.

</div>


</section>



<!-- ==================================================
     MAPA OBCHODOV
================================================== -->

<section class="card">


<h2>
  🗺️ Obchody v okolí
</h2>


<p class="meta">

  Povoľ svoju polohu a mapa zobrazí
  najbližšie obchody.

</p>


<div class="map-buttons">


  <button
    class="primary"
    onclick="mojaPoloha()"
  >
    📍 Moja poloha
  </button>


  <button
    class="secondary"
    onclick="findNearbyStoresByBrand('Lidl')"
  >
    🛒 Lidl
  </button>


  <button
    class="secondary"
    onclick="findNearbyStoresByBrand('COOP')"
  >
    🛒 COOP Jednota
  </button>


  <button
    class="secondary"
    onclick="findNearbyStoresByBrand('Kaufland')"
  >
    🛒 Kaufland
  </button>


  <button
    class="secondary"
    onclick="findNearbyStores()"
  >
    🏪 Všetky obchody
  </button>

</div>


<div
  id="selectedStore"
  class="selected-store"
>

  📍 Klikni na „Moja poloha“.

</div>


<!-- MAPA -->

<div
  id="map"
></div>


<!-- ZOZNAM OBCHODOV -->

<div
  id="nearbyStores"
  class="nearby-stores"
></div>


</section>



<!-- ==================================================
     DETAIL NÁKUPU
================================================== -->

<section
  id="shoppingPage"
  class="card hidden"
>


<div class="user-bar">

  <div class="user-name">

    👤
    <span id="shoppingUser">
      Používateľ
    </span>

  </div>


  <button
    class="secondary"
    onclick="logoutUser()"
  >
    🚪 Odhlásiť sa
  </button>

</div>


<!-- SPÄŤ -->

<button
  class="back"
  onclick="showDates()"
>
  ← Späť na dátumy
</button>


<!-- VYBRANÝ DÁTUM -->

<div
  id="selectedDate"
  class="selected-date"
></div>


<!-- OBCHODY -->

<h2>
  🏪 Obchod
</h2>


<div
  id="stores"
  class="stores"
></div>


<h3
  id="shopTitle"
  class="shop-title"
></h3>


<!-- ==================================================
     PRIDAŤ POLOŽKU
================================================== -->

<div class="add-item">


  <input
    id="itemName"
    placeholder="Čo treba kúpiť?"
  >


  <input
    id="itemQty"
    type="number"
    min="1"
    value="1"
  >


  <button
    class="primary"
    onclick="addItem()"
  >
    + Pridať
  </button>


</div>


<!-- ==================================================
     ZOZNAM POLOŽIEK
================================================== -->

<div
  id="itemList"
></div>


<!-- ==================================================
     SPODNÁ LIŠTA
================================================== -->

<div class="bottom">


  <span
    id="itemCount"
  ></span>


  <button
    class="danger"
    onclick="clearBought()"
  >
    Vymazať kúpené
  </button>


</div>


</section>


</div>



<!-- ==================================================
     LEAFLET
================================================== -->

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>



<!-- ==================================================
     PRIHLÁSENIE
================================================== -->

<script
  src="js/auth.js">
</script>



<!-- ==================================================
     NÁKUPNÝ KALENDÁR
================================================== -->

<script
  src="js/app.js">
</script>



<!-- ==================================================
     MAPA
================================================== -->

<script
  src="js/map.js">
</script>



<script>

/* =====================================================
   KONTROLA PRIHLÁSENIA
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    if(
      typeof getCurrentUser ===
      "function"
    ){

      const user =
        getCurrentUser();


      /*
       * Neprihlásený používateľ
       * nesmie používať aplikáciu.
       */

      if(!user){

        window.location.href =
          "login.html";

        return;

      }


      const currentUser =
        document.getElementById(
          "currentUser"
        );


      const shoppingUser =
        document.getElementById(
          "shoppingUser"
        );


      if(currentUser){

        currentUser.textContent =
          user;

      }


      if(shoppingUser){

        shoppingUser.textContent =
          user;

      }

    }

  }
);


/* =====================================================
   ODHLÁSENIE
===================================================== */

function logoutUser(){

  if(
    typeof logout ===
    "function"
  ){

    logout();

    return;

  }


  localStorage.removeItem(
    "loggedInUser"
  );


  localStorage.removeItem(
    "currentUser"
  );


  localStorage.removeItem(
    "user"
  );


  window.location.href =
    "index.html";

}


/* =====================================================
   OCHRANA PRI NÁVRATE NA STRÁNKU
===================================================== */

window.addEventListener(
  "pageshow",
  function(){

    if(
      typeof getCurrentUser ===
      "function"
    ){

      if(!getCurrentUser()){

        window.location.href =
          "login.html";

      }

    }

  }
);


/* =====================================================
   DNEŠNÝ DÁTUM
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    const dateInput =
      document.getElementById(
        "newDate"
      );


    if(
      dateInput &&
      !dateInput.value
    ){

      const today =
        new Date()
          .toISOString()
          .slice(0,10);


      dateInput.value =
        today;

    }

  }
);

</script>


</body>

</html>
