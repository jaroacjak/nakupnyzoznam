<!DOCTYPE html>
<html lang="sk">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🛒 Nákupný kalendár</title>

<link rel="stylesheet" href="css/style.css">

<!-- Leaflet mapa -->
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

#map{
  width:100%;
  height:500px;
  border-radius:18px;
  margin-top:15px;
  border:1px solid #ddd;
}

.map-controls{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px;
}

.map-controls button{
  flex:1;
  min-width:130px;
}

.map-info{
  margin-top:12px;
  padding:12px;
  background:#f1f1f1;
  border-radius:12px;
}

.selected-map-store{
  margin-top:10px;
  padding:12px;
  background:#eaf7ea;
  border-radius:12px;
  display:none;
}

.store-choice{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:10px;
  padding:12px;
  border:1px solid #ddd;
  border-radius:12px;
  background:#fafafa;
}

.store-choice-info{
  flex:1;
}

.store-choice-name{
  font-weight:bold;
}

.store-choice-distance{
  color:#777;
  font-size:13px;
  margin-top:3px;
}

.user-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:15px;
}

.user-name{
  font-weight:bold;
}

@media(max-width:600px){

  #map{
    height:380px;
  }

  .map-controls{
    display:grid;
    grid-template-columns:1fr 1fr;
  }

  .map-controls button{
    min-width:0;
  }

  .user-bar{
    flex-direction:column;
    align-items:flex-start;
  }

}

</style>

</head>


<body>


<div class="app">


<!-- =====================================================
     HLAVNÝ NÁKUPNÝ KALENDÁR
===================================================== -->

<section
  id="datesPage"
  class="card"
>


<div class="user-bar">

  <div class="user-name">

    👤
    <span id="currentUser">
      Používateľ
    </span>

  </div>


  <button
    class="secondary"
    onclick="logoutUser()"
  >
    🚪 Odhlásiť sa
  </button>

</div>


<h1>
  🛒 Nákupný kalendár
</h1>


<!-- =====================================================
     PRIDAŤ DÁTUM
===================================================== -->

<div class="date-add">

  <input
    id="newDate"
    type="date"
  >


  <button
    class="primary"
    onclick="addDate()"
  >
    + Pridať dátum
  </button>

</div>


<h2>
  📅 Všetky dátumy
</h2>


<div
  id="dateList"
  class="date-list"
></div>


<div class="note">

  Všetko sa automaticky ukladá
  v tomto prehliadači.

</div>


</section>



<!-- =====================================================
     MAPA
===================================================== -->

<section class="card">


<h2>
  🗺️ Mapa obchodov
</h2>


<p class="meta">

  Vyber si obchod priamo na mape.
  Môžeš si mapu približovať a posúvať.

</p>


<div class="map-controls">


  <button
    class="primary"
    onclick="mojaPoloha()"
  >
    📍 Moja poloha
  </button>


  <button
    class="secondary"
    onclick="showSlovakia()"
  >
    🇸🇰 Slovensko
  </button>


  <button
    class="secondary"
    onclick="findNearbyStores()"
  >
    🏪 Obchody v okolí
  </button>


</div>


<div
  id="mapInfo"
  class="map-info"
>

  🗺️ Vyber obchod na mape.

</div>


<div
  id="selectedMapStore"
  class="selected-map-store"
></div>


<!-- =====================================================
     MAPA
===================================================== -->

<div id="map"></div>


<!-- =====================================================
     ZOZNAM OBCHODOV
===================================================== -->

<div
  id="nearbyStores"
></div>


</section>



<!-- =====================================================
     DETAIL NÁKUPNÉHO DŇA
===================================================== -->

<section
  id="shoppingPage"
  class="card hidden"
>


<div class="user-bar">

  <div class="user-name">

    👤
    <span id="shoppingUser">
      Používateľ
    </span>

  </div>


  <button
    class="secondary"
    onclick="logoutUser()"
  >
    🚪 Odhlásiť sa
  </button>

</div>


<!-- SPÄŤ -->

<button
  class="back"
  onclick="showDates()"
>
  ← Späť na dátumy
</button>


<!-- DÁTUM -->

<div
  id="selectedDate"
  class="selected-date"
></div>



<!-- =====================================================
     VÝBER OBCHODU
===================================================== -->

<h2>
  🏪 Vyber obchod
</h2>


<div
  id="stores"
  class="stores"
></div>


<h3
  id="shopTitle"
  class="shop-title"
></h3>



<!-- =====================================================
     PRIDAŤ POLOŽKU
===================================================== -->

<div class="add-item">


  <input
    id="itemName"
    placeholder="Čo treba kúpiť?"
  >


  <input
    id="itemQty"
    type="number"
    min="1"
    value="1"
  >


  <button
    class="primary"
    onclick="addItem()"
  >
    + Pridať
  </button>


</div>



<!-- =====================================================
     ZOZNAM POLOŽIEK
===================================================== -->

<div
  id="itemList"
></div>



<!-- =====================================================
     SPODNÁ LIŠTA
===================================================== -->

<div class="bottom">


  <span
    id="itemCount"
  ></span>


  <button
    class="danger"
    onclick="clearBought()"
  >
    Vymazať kúpené
  </button>


</div>


</section>


</div>



<!-- =====================================================
     LEAFLET
===================================================== -->

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>



<!-- =====================================================
     AUTH
===================================================== -->

<script
  src="js/auth.js">
</script>



<!-- =====================================================
     NÁKUPNÝ KALENDÁR
===================================================== -->

<script
  src="js/app.js">
</script>



<!-- =====================================================
     MAPA
===================================================== -->

<script
  src="js/map.js">
</script>



<script>

/* =====================================================
   KONTROLA PRIHLÁSENIA
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    if(
      typeof getCurrentUser ===
      "function"
    ){

      const user =
        getCurrentUser();


      if(!user){

        window.location.href =
          "login.html";

        return;

      }


      const currentUser =
        document.getElementById(
          "currentUser"
        );


      const shoppingUser =
        document.getElementById(
          "shoppingUser"
        );


      if(currentUser){

        currentUser.textContent =
          user;

      }


      if(shoppingUser){

        shoppingUser.textContent =
          user;

      }

    }


    /*
     * Dnešný dátum.
     */

    const dateInput =
      document.getElementById(
        "newDate"
      );


    if(
      dateInput &&
      !dateInput.value
    ){

      const today =
        new Date()
          .toISOString()
          .slice(0,10);


      dateInput.value =
        today;

    }

  }
);


/* =====================================================
   ODHLÁSENIE
===================================================== */

function logoutUser(){

  if(
    typeof logout ===
    "function"
  ){

    logout();

    return;

  }


  localStorage.removeItem(
    "loggedInUser"
  );

  localStorage.removeItem(
    "currentUser"
  );

  localStorage.removeItem(
    "user"
  );


  window.location.href =
    "index.html";

}


/* =====================================================
   OCHRANA STRÁNKY
===================================================== */

window.addEventListener(
  "pageshow",
  function(){

    if(
      typeof getCurrentUser ===
      "function"
    ){

      if(!getCurrentUser()){

        window.location.href =
          "login.html";

      }

    }

  }
);

</script>


</body>

</html>
