<html lang="sk">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

  rel="stylesheet"

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f2f4f7;
  color: #222;
  font-family: Arial, sans-serif;
}

.app {
  max-width: 950px;
  margin: auto;
  padding: 16px;
}

.card {
  background: #fff;
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 5px 25px rgba(0,0,0,.08);
  margin-bottom: 16px;
}

h1 {
  text-align: center;
  margin: 5px 0 20px;
}

h2 {
  margin-top: 5px;
}

button,
input {
  font: inherit;
  border-radius: 10px;
}

button {
  cursor: pointer;
}

input {
  border: 1px solid #ccc;
  padding: 11px;
  width: 100%;
}

.primary {
  background: #222;
  color: white;
  border: 0;
  padding: 11px 15px;
}

.secondary {
  background: #eee;
  color: #222;
  border: 0;
  padding: 11px 15px;
}

.danger {
  background: #d9534f;
  color: white;
  border: 0;
  padding: 10px 13px;
}

.hidden {
  display: none !important;
}


/* =========================
   HORNÁ LIŠTA
========================= */

.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.user-info {
  min-width: 0;
}

.user-label {
  font-size: 12px;
  color: #777;
}

.user-email {
  font-weight: bold;
  margin-top: 3px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.logout-button {
  white-space: nowrap;
}


/* =========================
   DÁTUMY
========================= */

.date-add {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  margin-bottom: 18px;
}

.date-list {
  display: grid;
  gap: 10px;
}

.date-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  background: #fafafa;
  border: 1px solid #ddd;
  border-radius: 14px;
  padding: 14px;
}

.date-info {
  flex: 1;
  cursor: pointer;
}

.date-title {
  font-weight: bold;
  font-size: 17px;
}

.date-meta {
  margin-top: 5px;
  color: #777;
  font-size: 13px;
}

.date-actions {
  display: flex;
  gap: 6px;
}

.empty {
  text-align: center;
  color: #888;
  padding: 30px 10px;
}


/* =========================
   OBCHODY
========================= */

.stores {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 8px;
  margin-bottom: 15px;
}

.store-button {
  min-width: 110px;
  padding: 10px;
  border: 0;
  background: #eee;
  white-space: nowrap;
}

.store-button.active {
  background: #222;
  color: white;
}

.shop-title {
  margin: 10px 0 15px;
}


/* =========================
   POLOŽKY
========================= */

.add-item {
  display: grid;
  grid-template-columns: 1fr 90px 110px;
  gap: 8px;
  margin-bottom: 15px;
}

.item-list {
  display: grid;
}

.item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 12px 0;
  border-bottom: 1px solid #eee;
}

.item-checkbox {
  width: auto;
}

.item-name {
  flex: 1;
  min-width: 0;
  word-break: break-word;
}

.item.done .item-name {
  text-decoration: line-through;
  opacity: .5;
}

.quantity {
  display: flex;
  align-items: center;
  gap: 5px;
}

.quantity button {
  width: 32px;
  height: 32px;
  padding: 0;
  border: 0;
  background: #eee;
}

.item-edit {
  border: 0;
  background: #eee;
  padding: 8px 10px;
}

.item-delete {
  border: 0;
  background: #d9534f;
  color: white;
  padding: 8px 10px;
}

.bottom-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-top: 18px;
}

.item-count {
  color: #777;
  font-size: 13px;
}


/* =========================
   MAPA
========================= */

.map-status {
  background: #f1f1f1;
  padding: 10px;
  border-radius: 10px;
  margin-bottom: 10px;
  font-size: 14px;
}

.map-buttons {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
}

.map-buttons button {
  flex: 1;
}

#map {
  width: 100%;
  height: 480px;
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid #ddd;
}

.shop-icon {
  width: 44px;
  height: 44px;
  background: white;
  border: 2px solid #222;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,.35);
}

.shop-icon img {
  width: 36px;
  height: 36px;
  object-fit: contain;
}

.store-popup {
  min-width: 240px;
  text-align: center;
}

.store-popup img {
  width: 55px;
  height: 55px;
  object-fit: contain;
}

.store-popup h3 {
  margin: 7px 0;
}

.store-popup p {
  margin: 7px 0;
}

.store-popup button {
  width: 100%;
  margin-top: 7px;
}

.hours {
  text-align: left;
  font-size: 13px;
  line-height: 1.6;
  margin-top: 10px;
}


/* =========================
   ZDIEĽANIE
========================= */

.share-box {
  margin-top: 20px;
  padding: 15px;
  background: #f7f7f7;
  border: 1px solid #ddd;
  border-radius: 14px;
}

.share-title {
  font-weight: bold;
  margin-bottom: 7px;
}

.share-description {
  color: #777;
  font-size: 13px;
  line-height: 1.5;
  margin-bottom: 12px;
}

.share-form {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
}

.share-status {
  margin-top: 10px;
  font-size: 13px;
  color: #777;
}

.shared-users {
  margin-top: 10px;
  display: grid;
  gap: 7px;
}

.shared-user {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  background: white;
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 9px;
  font-size: 14px;
}


/* =========================
   RESPONSIVE
========================= */

@media (max-width: 650px) {

  .top-bar {
    align-items: flex-start;
    flex-direction: column;
  }

  .logout-button {
    width: 100%;
  }

  .date-add {
    grid-template-columns: 1fr;
  }

  .date-row {
    align-items: flex-start;
    flex-direction: column;
  }

  .date-actions {
    width: 100%;
  }

  .date-actions button {
    flex: 1;
  }

  .add-item {
    grid-template-columns: 1fr 80px;
  }

  .add-item button {
    grid-column: 1 / -1;
  }

  .item {
    flex-wrap: wrap;
  }

  .item-name {
    min-width: calc(100% - 40px);
  }

  .bottom-bar {
    align-items: flex-start;
    flex-direction: column;
  }

  .share-form {
    grid-template-columns: 1fr;
  }

  #map {
    height: 420px;
  }

}

<!-- ==================================================

================================================== -->

<section

<!-- ==================================================

================================================== -->

<section class="card">

</section>


</div>

/* ==================================================
   LOKÁLNY DÁTUM
================================================== */

function getLocalDateString() {

  const now = new Date();

  const offset =
    now.getTimezoneOffset();

  return new Date(
    now.getTime() -
    offset * 60000
  )
  .toISOString()
  .slice(0,10);

}


/* ==================================================
   ÚNIKOVÉ HTML
================================================== */

function escapeHtml(value) {

  const div =
    document.createElement("div");

  div.textContent =
    String(value ?? "");

  return div.innerHTML;

}


/* ==================================================
   ZABEZPEČENIE ŠTRUKTÚRY DÁT
================================================== */

function ensureDate(date) {

  if (!date) {
    return;
  }

  if (
    !database[date] ||
    typeof database[date] !== "object"
  ) {

    database[date] = {};

  }

  STORES.forEach(function(store) {

    if (
      !Array.isArray(
        database[date][store]
      )
    ) {

      database[date][store] = [];

    }

  });

}


/* ==================================================
   FIREBASE PRIHLÁSENIE
================================================== */

auth.onAuthStateChanged(function(user) {

  if (!user) {

    window.location.href =
      "login.html";

    return;

  }

  currentFirebaseUser =
    user;


  const userElement =
    document.getElementById(
      "currentUser"
    );


  if (userElement) {

    userElement.textContent =
      user.email ||
      user.displayName ||
      "Používateľ";

  }


  loadFirebaseData();

  loadSharing();

});


/* ==================================================

function logout() {

    .then(function() {

    })
    .catch(function(error) {

      alert(

      );

    });

}


/* ==================================================
   ULOŽENIE DÁT DO FIREBASE
================================================== */

function save() {

  /*
   * Lokálna záloha.
   */

  try {

    localStorage.setItem(
      "nakupnyKalendárV2",
      JSON.stringify(database)
    );

  } catch (error) {

    console.error(
      "LocalStorage:",
      error
    );

  }


  /*
   * Firebase.
   */

  if (!currentFirebaseUser) {

    return Promise.resolve();

  }


  return firebaseDatabase
    .ref(
      "users/" +
      currentFirebaseUser.uid +
      "/shoppingData"
    )
    .set(database)
    .then(function() {

      console.log(
        "Dáta uložené do Firebase."
      );

    })
    .catch(function(error) {

      console.error(
        "Firebase uloženie:",
        error
      );

      alert(
        "Dáta sa nepodarilo uložiť do databázy."
      );

      throw error;

    });

}


/* ==================================================
   NAČÍTANIE DÁT Z FIREBASE
================================================== */

function loadFirebaseData() {

  if (!currentFirebaseUser) {
    return;
  }


  firebaseDatabase
    .ref(
      "users/" +
      currentFirebaseUser.uid +
      "/shoppingData"
    )
    .once("value")
    .then(function(snapshot) {

      const data =
        snapshot.val();


      if (
        data &&
        typeof data === "object"
      ) {

        database = data;

      } else {

        database = {};

      }


      /*
       * Zabezpečíme správnu štruktúru
       * starších dát.
       */

      Object.keys(database)
        .forEach(function(date) {

          ensureDate(date);

        });


      try {

        localStorage.setItem(
          "nakupnyKalendárV2",
          JSON.stringify(database)
        );

      } catch (error) {

        console.error(error);

      }


      renderDates();

    })
    .catch(function(error) {

      console.error(
        "Firebase načítanie:",
        error
      );


      /*
       * Ak Firebase nefunguje,
       * použije sa lokálna záloha.
       */

      try {

        database =
          JSON.parse(
            localStorage.getItem(
              "nakupnyKalendárV2"
            ) || "{}"
          );

      } catch (e) {

        database = {};

      }


      renderDates();

    });

}


/* ==================================================
   FORMÁT DÁTUMU
================================================== */

function formatDate(date) {

  return new Intl.DateTimeFormat(
    "sk-SK",
    {
      weekday: "long",
      day: "numeric",
      month: "long",
      year: "numeric"
    }
  ).format(
    new Date(
      date + "T12:00:00"
    )
  );

}


/* ==================================================
   PRIDAŤ DÁTUM
================================================== */

function addDate() {

  const input =
    document.getElementById(
      "newDate"
    );


  const date =
    input.value;


  if (!date) {

    alert(
      "Vyber dátum."
    );

    input.focus();

    return;

  }


  /*
   * Ak dátum ešte neexistuje,
   * vytvoríme ho.
   */

  if (!database[date]) {

    database[date] = {};

  }


  ensureDate(date);


  /*
   * Uloženie do databázy.
   */

  save()
    .then(function() {

      currentDate = date;

      currentStore =
        localStorage.getItem(
          "poslednyObchod"
        ) || "Lidl";


      if (
        !STORES.includes(
          currentStore
        )
      ) {

        currentStore = "Lidl";

      }


      openShoppingPage();

    })
    .catch(function() {

      /*
       * Dátum zostane aj lokálne.
       */

      currentDate = date;

      openShoppingPage();

    });

}


/* ==================================================
   ZOBRAZIŤ DÁTUMY
================================================== */

function showDates() {

  currentDate = null;

  currentStore = null;


  document
    .getElementById("shoppingPage")
    .classList.add("hidden");


  document
    .getElementById("datesPage")
    .classList.remove("hidden");


  renderDates();

}


/* ==================================================
   VYKRESLIŤ DÁTUMY
================================================== */

function renderDates() {

  const list =
    document.getElementById(
      "dateList"
    );


  if (!list) {
    return;
  }


  const dates =
    Object.keys(database)
      .sort()
      .reverse();


  if (!dates.length) {

    list.innerHTML = `
      <div class="empty">
        Zatiaľ nemáš žiadny dátum.
        <br><br>
        Vyber dátum vyššie a klikni na
        <b>Pridať dátum</b>.
      </div>
    `;

    return;

  }


  list.innerHTML =
    dates.map(function(date) {

      ensureDate(date);


      let total = 0;

      let bought = 0;


      STORES.forEach(function(store) {

        const items =
          Array.isArray(
            database[date][store]
          )
            ? database[date][store]
            : [];


        total += items.length;


        bought +=
          items.filter(function(item) {

            return item.done === true;

          }).length;

      });


      return `
        <div class="date-row">

          <div
            class="date-info"
            onclick="openDate('${date}')"
          >

            <div class="date-title">
              📅 ${escapeHtml(
                formatDate(date)
              )}
            </div>

            <div class="date-meta">
              ${total} položiek
              •
              ${bought} kúpených
            </div>

          </div>


          <div class="date-actions">

            <button
              class="primary"
              onclick="openDate('${date}')"
            >
              Otvoriť
            </button>

            <button
              class="secondary"
              onclick="editDate('${date}')"
            >
              ✏️
            </button>

            <button
              class="danger"
              onclick="deleteDate('${date}')"
            >
              🗑️
            </button>

          </div>

        </div>
      `;

    }).join("");

}


/* ==================================================
   OTVORIŤ DÁTUM
================================================== */

function openDate(date) {

  if (!database[date]) {

    database[date] = {};

  }


  ensureDate(date);


  currentDate =
    date;


  currentStore =
    localStorage.getItem(
      "poslednyObchod"
    ) || "Lidl";


  if (
    !STORES.includes(
      currentStore
    )
  ) {

    currentStore = "Lidl";

  }


  openShoppingPage();

}


/* ==================================================
   OTVORIŤ NÁKUPNÝ ZOZNAM
================================================== */

function openShoppingPage() {

  if (!currentDate) {
    return;
  }


  ensureDate(
    currentDate
  );


  document
    .getElementById("datesPage")
    .classList.add("hidden");


  document
    .getElementById("shoppingPage")
    .classList.remove("hidden");


  document
    .getElementById("selectedDate")
    .textContent =
      "📅 " +
      formatDate(
        currentDate
      );


  renderStores();

  renderItems();

}


/* ==================================================
   UPRAVIŤ DÁTUM
================================================== */

function editDate(date) {

  const newDate =
    prompt(
      "Zadaj nový dátum vo formáte RRRR-MM-DD:",
      date
    );


  if (newDate === null) {
    return;
  }


  const cleanDate =
    newDate.trim();


  if (
    !/^\d{4}-\d{2}-\d{2}$/.test(
      cleanDate
    )
  ) {

    alert(
      "Dátum musí byť vo formáte RRRR-MM-DD."
    );

    return;

  }


  if (
    cleanDate === date
  ) {

    return;

  }


  if (
    database[cleanDate]
  ) {

    alert(
      "Tento dátum už existuje."
    );

    return;

  }


  database[cleanDate] =
    database[date];


  delete database[date];


  save()
    .then(function() {

      renderDates();

    })
    .catch(function() {

      renderDates();

    });

}


/* ==================================================
   VYMAZAŤ DÁTUM
================================================== */

function deleteDate(date) {

  const confirmed =
    confirm(
      "Naozaj chceš vymazať celý nákupný zoznam pre tento dátum?"
    );


  if (!confirmed) {
    return;
  }


  delete database[date];


  save()
    .then(function() {

      if (
        currentDate === date
      ) {

        showDates();

      } else {

        renderDates();

      }

    })
    .catch(function() {

      renderDates();

    });

}


/* ==================================================
   OBCHODY
================================================== */

function renderStores() {

  const container =
    document.getElementById(
      "stores"
    );


  if (!container) {
    return;
  }

          }"

}


/* ==================================================
   VYBRAŤ OBCHOD
================================================== */

function selectStore(store) {

  if (
    !STORES.includes(
      store
    )
  ) {

    return;

  }


  if (!currentDate) {

    return;

  }


  currentStore =
    store;


  localStorage.setItem(
    "poslednyObchod",
    store
  );


  ensureDate(
    currentDate
  );


  renderStores();

  renderItems();

}


/* ==================================================
   PRIDAŤ POLOŽKU
================================================== */

function addItem() {

  if (!currentDate) {

    alert(
      "Najprv vyber dátum."
    );

    return;

  }


  if (!currentStore) {

    alert(
      "Najprv vyber obchod."
    );

    return;

  }


  ensureDate(
    currentDate
  );


  const nameInput =
    document.getElementById(
      "itemName"
    );


  const qtyInput =
    document.getElementById(
      "itemQty"
    );


  const name =
    nameInput.value.trim();


  const quantity =
    Math.max(
      1,
      parseInt(
        qtyInput.value,
        10
      ) || 1
    );


  if (!name) {

    nameInput.focus();

    return;

  }


  /*
   * TU sa položka ukladá presne pod:
   *
   * currentDate
   * currentStore
   *
   * teda napríklad:
   *
   * 2026-09-23
   *   └── Lidl
   *       └── mlieko
   */

  if (
    !Array.isArray(
      database[currentDate][currentStore]
    )
  ) {

    database[currentDate][currentStore] = [];

  }


  database[currentDate][currentStore]
    .push({

      id:
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .substring(2),

      name:
        name,

      quantity:
        quantity,

      done:
        false

    });


  /*
   * Hneď zobrazíme položku.
   */

  renderItems();


  /*
   * Vyčistíme formulár.
   */

  nameInput.value = "";

  qtyInput.value = 1;

  nameInput.focus();


  /*
   * A teraz uložíme celý dátum
   * do Firebase databázy.
   */

  save();

}


/* ==================================================
   NÁJSŤ POLOŽKU
================================================== */

function findItem(id) {

  if (
    !currentDate ||
    !currentStore
  ) {

    return null;

  }


  ensureDate(
    currentDate
  );


  const items =
    database[currentDate][currentStore];


  if (!Array.isArray(items)) {
    return null;
  }


  return items.find(function(item) {

    return String(item.id) ===
      String(id);

  });

}


/* ==================================================
   ZMENA MNOŽSTVA
================================================== */

function changeQty(
  id,
  amount
) {

  const item =
    findItem(id);


  if (!item) {
    return;
  }


  item.quantity =
    Math.max(
      1,
      Number(
        item.quantity || 1
      ) + amount
    );


  renderItems();

  save();

}


/* ==================================================
   KÚPENÉ / NEKÚPENÉ
================================================== */

function toggleItem(id) {

  const item =
    findItem(id);


  if (!item) {
    return;
  }


  item.done =
    !item.done;


  renderItems();

  save();

}


/* ==================================================
   UPRAVIŤ POLOŽKU
================================================== */

function editItem(id) {

  const item =
    findItem(id);


  if (!item) {
    return;
  }


  const name =
    prompt(
      "Názov položky:",
      item.name
    );


  if (name === null) {
    return;
  }


  const cleanName =
    name.trim();


  if (!cleanName) {
    return;
  }


  const quantity =
    prompt(
      "Množstvo:",
      item.quantity
    );


  if (quantity === null) {
    return;
  }


  item.name =
    cleanName;


  item.quantity =
    Math.max(
      1,
      parseInt(
        quantity,
        10
      ) || 1
    );


  renderItems();

  save();

}


/* ==================================================
   VYMAZAŤ POLOŽKU
================================================== */

function deleteItem(id) {

  if (
    !currentDate ||
    !currentStore
  ) {

    return;

  }


  ensureDate(
    currentDate
  );


  database[currentDate][currentStore] =
    database[currentDate][currentStore]
      .filter(function(item) {

        return String(item.id) !==
          String(id);

      });


  renderItems();

  save();

}


/* ==================================================
   VYMAZAŤ KÚPENÉ
================================================== */

function clearBought() {

  if (
    !currentDate ||
    !currentStore
  ) {

    return;

  }


  ensureDate(
    currentDate
  );


  database[currentDate][currentStore] =
    database[currentDate][currentStore]
      .filter(function(item) {

        return item.done !== true;

      });


  renderItems();

  save();

}


/* ==================================================
   VYKRESLIŤ POLOŽKY
================================================== */

function renderItems() {

  const container =
    document.getElementById(
      "itemList"
    );


  if (!container) {
    return;
  }


  if (
    !currentDate ||
    !currentStore
  ) {

    container.innerHTML = "";

    return;

  }


  ensureDate(
    currentDate
  );


  const items =
    database[currentDate][currentStore];


  if (
    !Array.isArray(items) ||
    items.length === 0
  ) {

    container.innerHTML = `
      <div class="empty">
        V tomto obchode zatiaľ
        nemáš žiadne položky.
      </div>
    `;

  } else {

    container.innerHTML =
      items.map(function(item) {

        const id =
          escapeHtml(
            String(item.id)
          );


        return `
          <div
            class="item ${
              item.done
                ? "done"
                : ""
            }"
          >

            <input
              class="item-checkbox"
              type="checkbox"
              ${
                item.done
                  ? "checked"
                  : ""
              }
              onchange="toggleItem('${id}')"
            >


            <span class="item-name">
              ${escapeHtml(item.name)}
            </span>


            <div class="quantity">

              <button
                onclick="changeQty('${id}', -1)"
              >
                −
              </button>

              <b>
                ${Number(item.quantity) || 1}
              </b>

              <button
                onclick="changeQty('${id}', 1)"
              >
                +
              </button>

            </div>


            <button
              class="item-edit"
              onclick="editItem('${id}')"
            >
              ✏️
            </button>


            <button
              class="item-delete"
              onclick="deleteItem('${id}')"
            >
              🗑️
            </button>

          </div>
        `;

      }).join("");

  }


  const count =
    items.length;


  const bought =
    items.filter(function(item) {

      return item.done === true;

    }).length;


  const counter =
    document.getElementById(
      "itemCount"
    );


  if (counter) {

    counter.textContent =
      count +
      " položiek • " +
      bought +
      " kúpených";

  }

}


/* ==================================================
   ZDIEĽANIE
================================================== */

function normalizeEmail(email) {

  return String(email || "")
    .trim()
    .toLowerCase();

}


function shareList() {

  if (!currentFirebaseUser) {

    return;

  }


  const input =
    document.getElementById(
      "shareEmail"
    );


  const status =
    document.getElementById(
      "shareStatus"
    );


  const email =
    normalizeEmail(
      input.value
    );


  if (!email) {

    status.textContent =
      "Zadaj e-mail.";

    input.focus();

    return;

  }


  if (
    email ===
    normalizeEmail(
      currentFirebaseUser.email
    )
  ) {

    status.textContent =
      "Svoj zoznam nemôžeš zdieľať sám so sebou.";

    return;

  }


  const key =
    encodeURIComponent(
      email
    );


  firebaseDatabase
    .ref(
      "sharedLists/" +
      currentFirebaseUser.uid +
      "/" +
      key
    )
    .set({

      ownerUid:
        currentFirebaseUser.uid,

      ownerEmail:
        currentFirebaseUser.email || "",

      sharedEmail:
        email,

      createdAt:
        firebase.database.ServerValue.TIMESTAMP

    })
    .then(function() {

      status.textContent =
        "✅ Zoznam bol zdieľaný s " +
        email;

      input.value = "";

      loadSharing();

    })
    .catch(function(error) {

      console.error(
        "Zdieľanie:",
        error
      );

      status.textContent =
        "❌ Zdieľanie sa nepodarilo.";

    });

}


/* ==================================================
   NAČÍTAŤ ZDIEĽANIE
================================================== */

function loadSharing() {

  if (!currentFirebaseUser) {
    return;
  }


  const container =
    document.getElementById(
      "sharedUsers"
    );


  if (!container) {
    return;
  }


  firebaseDatabase
    .ref(
      "sharedLists/" +
      currentFirebaseUser.uid
    )
    .once("value")
    .then(function(snapshot) {

      const data =
        snapshot.val() || {};


      const users =
        Object.values(data);


      if (!users.length) {

        container.innerHTML = "";

        return;

      }


      container.innerHTML =
        users.map(function(user) {

          return `
            <div class="shared-user">

              <span>
                👤
                ${escapeHtml(
                  user.sharedEmail
                )}
              </span>

              <button
                class="danger"
                onclick="removeSharedUser('${escapeHtml(
                  user.sharedEmail
                )}')"
              >
                Zrušiť
              </button>

            </div>
          `;

        }).join("");

    })
    .catch(function(error) {

      console.error(
        "Zdieľanie:",
        error
      );

    });

}


/* ==================================================
   ZRUŠIŤ ZDIEĽANIE
================================================== */

function removeSharedUser(email) {

  if (!currentFirebaseUser) {
    return;
  }


  const key =
    encodeURIComponent(
      normalizeEmail(email)
    );


  firebaseDatabase
    .ref(
      "sharedLists/" +
      currentFirebaseUser.uid +
      "/" +
      key
    )
    .remove()
    .then(function() {

      loadSharing();

    })
    .catch(function(error) {

      console.error(
        "Zrušenie zdieľania:",
        error
      );

    });

}


/* ==================================================
   MAPA
================================================== */

function createMap() {

  if (
    typeof L === "undefined"
  ) {

    document.getElementById(
      "mapStatus"
    ).textContent =
      "❌ Mapu sa nepodarilo načítať.";

    return;

  }


  if (map) {
    return;
  }


  map =
    L.map(
      "map"
    ).setView(
      [49.220,18.560],
      14
    );


  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 19,

      attribution:
        "&copy; OpenStreetMap contributors"
    }
  ).addTo(map);


  renderStoresOnMap();


  document.getElementById(
    "mapStatus"
  ).textContent =
    "🟢 Mapa je pripravená.";


  setTimeout(function() {

    map.invalidateSize();

  }, 300);

}


/* ==================================================
   OTVORENÉ / ZATVORENÉ
================================================== */

function getStoreStatus(store) {

  const now =
    new Date();


  const day =
    now.getDay();


  const hours =
    store.hours
      ? store.hours[day]
      : null;


  if (!hours) {

    return {
      open: false,
      text: "🔴 Zatvorené"
    };

  }


  const current =
    now.getHours() * 60 +
    now.getMinutes();


  const opening =
    parseTime(
      hours[0]
    );


  const closing =
    parseTime(
      hours[1]
    );


  if (
    current >= opening &&
    current < closing
  ) {

    return {
      open: true,
      text:
        "🟢 Otvorené do " +
        hours[1]
    };

  }


  return {
    open: false,
    text: "🔴 Zatvorené"
  };

}


function parseTime(time) {

  const parts =
    time.split(":");


  return (
    Number(parts[0]) * 60 +
    Number(parts[1])
  );

}


/* ==================================================
   OTVÁRACIE HODINY
================================================== */

function getHoursHtml(store) {

  const days = [
    "Ne",
    "Po",
    "Ut",
    "St",
    "Št",
    "Pi",
    "So"
  ];


  if (!store.hours) {
    return "";
  }


  return days.map(function(day, index) {

    const hours =
      store.hours[index];


    if (!hours) {

      return `
        <div>
          <b>${day}:</b>
          zatvorené
        </div>
      `;

    }


    return `
      <div>
        <b>${day}:</b>
        ${hours[0]} – ${hours[1]}
      </div>
    `;

  }).join("");

}


/* ==================================================
   OBCHODY NA MAPE
================================================== */

function renderStoresOnMap() {

  if (!map) {
    return;
  }


  storeMarkers.forEach(function(marker) {

    map.removeLayer(marker);

  });


  storeMarkers = [];


  Object.keys(STORE_DATA)
    .forEach(function(storeName) {

      STORE_DATA[storeName]
        .forEach(function(store) {

          const status =
            getStoreStatus(store);


          const icon =
            L.divIcon({

              className: "",

              html: `
                <div class="shop-icon">

                  <img
                    src="${store.logo}"
                    alt=""
                    onerror="
                      this.style.display='none'
                    "
                  >

                </div>
              `,

              iconSize: [
                44,
                44
              ],

              iconAnchor: [
                22,
                22
              ]

            });


          const marker =
            L.marker(
              [
                store.lat,
                store.lng
              ],
              {
                icon: icon
              }
            )
            .addTo(map);


          marker.bindPopup(`

            <div class="store-popup">

              <img
                src="${store.logo}"
                alt=""
              >

              <h3>
                ${escapeHtml(
                  store.name
                )}
              </h3>

              <p>
                📍
                ${escapeHtml(
                  store.address
                )}
              </p>

              <p>
                ${status.text}
              </p>

              <div class="hours">

                <b>
                  Otváracie hodiny
                </b>

                ${getHoursHtml(store)}

              </div>

              <button
                class="primary"
                onclick="
                  selectStoreFromMap(
                    '${escapeHtml(storeName)}'
                  )
                "
              >
                🛒 Nakupovať tu
              </button>

              <button
                class="secondary"
                onclick="
                  navigateTo(
                    ${store.lat},
                    ${store.lng}
                  )
                "
              >
                🧭 Navigovať
              </button>

            </div>

          `);


          storeMarkers.push(
            marker
          );

        });

    });

}

  );


  openShoppingPage();

}

/* ==================================================
   MOJA POLOHA

function mojaPoloha() {

    document.getElementById(
      "mapStatus"
    );


  if (
    !navigator.geolocation
  ) {

    status.textContent =
      "❌ Tvoj prehliadač nepodporuje určovanie polohy.";

  }


  status.textContent =
    "📍 Získavam tvoju polohu...";


  navigator.geolocation.getCurrentPosition(

    function(position) {

      const lat =
        position.coords.latitude;

      const lng =
        position.coords.longitude;


      if (userMarker) {

        map.removeLayer(
          userMarker
        );

      }


      userMarker =
        L.marker(
          [
            lat,
            lng
          ]
        )
        .addTo(map)
        .bindPopup(
          "📍 Tvoja poloha"
        )
        .openPopup();


      map.setView(
        [
          lat,
          lng
        ],
        15
      );


      status.textContent =
        "📍 Tvoja poloha bola nájdená.";

    },

    function(error) {

      console.error(
        "Geolocation:",
        error
      );


      status.textContent =
        "❌ Tvoju polohu sa nepodarilo získať.";

    },

    {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 60000
    }

  );

}


/* ==================================================
   ENTER V POLOŽKE
================================================== */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    const itemName =
      document.getElementById(
        "itemName"
      );


    const itemQty =
      document.getElementById(
        "itemQty"
      );


    if (itemName) {

      itemName.addEventListener(
        "keydown",
        function(event) {

          if (
            event.key === "Enter"
          ) {

            event.preventDefault();

            addItem();

          }

        }
      );

    }


    if (itemQty) {

      itemQty.addEventListener(
        "keydown",
        function(event) {

          if (
            event.key === "Enter"
          ) {

            event.preventDefault();

            addItem();

          }

        }
      );

    }


    /*
     * Predvolene dnešný dátum.
     */

    const dateInput =
      document.getElementById(
        "newDate"
      );


    if (dateInput) {

      dateInput.value =
        getLocalDateString();

    }


    /*
     * Zobrazíme dátumy.
     */

    renderDates();


    /*
     * Spustíme mapu.
     */

    createMap();


    /*
     * Aktualizácia otváracích hodín
     * každú minútu.
     */

    setInterval(
      function() {

        renderStoresOnMap();

      },
      60000
    );

  }
);

</script>
