<!DOCTYPE html>
<html lang="sk">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>🛒 Nákupný kalendár</title>


<link
  rel="stylesheet"
  href="css/style.css"
>


<!-- =====================================================
     LEAFLET
===================================================== -->

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>


<style>

/* =====================================================
   MAPA
===================================================== */

#map{

  width:100%;

  height:500px;

  margin-top:15px;

  border-radius:18px;

  border:1px solid #ddd;

}


/* =====================================================
   TLAČIDLO MOJA POLOHA
===================================================== */

.location-button{

  width:100%;

  margin-top:10px;

  font-size:16px;

}


/* =====================================================
   INFORMÁCIA O MAPE
===================================================== */

.map-info{

  margin-top:10px;

  padding:12px;

  border-radius:12px;

  background:#f1f1f1;

}


/* =====================================================
   VYBRANÝ OBCHOD
===================================================== */

.selected-map-store{

  display:none;

  margin-top:10px;

  padding:12px;

  border-radius:12px;

  background:#eaf7ea;

}


/* =====================================================
   POUŽÍVATEĽ
===================================================== */

.user-bar{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:10px;

  margin-bottom:15px;

}


.user-name{

  font-weight:bold;

}


/* =====================================================
   MOBIL
===================================================== */

@media(max-width:600px){

  #map{

    height:380px;

  }


  .user-bar{

    align-items:flex-start;

    flex-direction:column;

  }

}

</style>

</head>


<body>


<div class="app">


<!-- =====================================================
     DÁTUMY
===================================================== -->

<section
  id="datesPage"
  class="card"
>


<div class="user-bar">


  <div class="user-name">

    👤

    <span id="currentUser">
      Používateľ
    </span>

  </div>


  <button
    class="secondary"
    onclick="logoutUser()"
  >

    🚪 Odhlásiť sa

  </button>


</div>


<h1>

  🛒 Nákupný kalendár

</h1>



<!-- =====================================================
     PRIDAŤ DÁTUM
===================================================== -->

<div class="date-add">


  <input
    id="newDate"
    type="date"
  >


  <button
    class="primary"
    onclick="addDate()"
  >

    + Pridať dátum

  </button>


</div>



<h2>

  📅 Všetky dátumy

</h2>


<div
  id="dateList"
  class="date-list"
></div>


<div class="note">

  Všetko sa automaticky ukladá
  v tomto prehliadači.

</div>


</section>



<!-- =====================================================
     MAPA
===================================================== -->

<section class="card">


<h2>

  🗺️ Mapa obchodov

</h2>


<p class="meta">

  Klikni na „Moja poloha“ a povoľ
  prehliadaču prístup k tvojej polohe.

</p>


<!-- =====================================================
     MOJA POLOHA
===================================================== -->

<button
  class="primary location-button"
  onclick="mojaPoloha()"
>

  📍 Moja poloha

</button>



<!-- =====================================================
     INFORMÁCIA
===================================================== -->

<div
  id="mapInfo"
  class="map-info"
>

  📍 Poloha zatiaľ nebola určená.

</div>



<!-- =====================================================
     VYBRANÝ OBCHOD
===================================================== -->

<div
  id="selectedMapStore"
  class="selected-map-store"
></div>



<!-- =====================================================
     MAPA
===================================================== -->

<div id="map"></div>


</section>



<!-- =====================================================
     DETAIL NÁKUPU
===================================================== -->

<section
  id="shoppingPage"
  class="card hidden"
>


<div class="user-bar">


  <div class="user-name">

    👤

    <span id="shoppingUser">
      Používateľ
    </span>

  </div>


  <button
    class="secondary"
    onclick="logoutUser()"
  >

    🚪 Odhlásiť sa

  </button>


</div>



<!-- SPÄŤ -->

<button
  class="back"
  onclick="showDates()"
>

  ← Späť na dátumy

</button>



<!-- DÁTUM -->

<div
  id="selectedDate"
  class="selected-date"
></div>



<!-- =====================================================
     OBCHODY
===================================================== -->

<h2>

  🏪 Obchod

</h2>


<div
  id="stores"
  class="stores"
></div>


<h3
  id="shopTitle"
  class="shop-title"
></h3>



<!-- =====================================================
     PRIDAŤ POLOŽKU
===================================================== -->

<div class="add-item">


  <input
    id="itemName"
    placeholder="Čo treba kúpiť?"
  >


  <input
    id="itemQty"
    type="number"
    min="1"
    value="1"
  >


  <button
    class="primary"
    onclick="addItem()"
  >

    + Pridať

  </button>


</div>



<!-- =====================================================
     ZOZNAM POLOŽIEK
===================================================== -->

<div
  id="itemList"
></div>



<!-- =====================================================
     SPODOK
===================================================== -->

<div class="bottom">


  <span
    id="itemCount"
  ></span>


  <button
    class="danger"
    onclick="clearBought()"
  >

    Vymazať kúpené

  </button>


</div>


</section>


</div>



<!-- =====================================================
     LEAFLET JS
===================================================== -->

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>



<!-- =====================================================
     AUTH
===================================================== -->

<script
  src="js/auth.js">
</script>



<!-- =====================================================
     APP
===================================================== -->

<script
  src="js/app.js">
</script>



<!-- =====================================================
     MAP
===================================================== -->

<script
  src="js/map.js">
</script>



<script>

/* =====================================================
   KONTROLA PRIHLÁSENIA
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    if(
      typeof getCurrentUser ===
      "function"
    ){

      const user =
        getCurrentUser();


      if(!user){

        window.location.href =
          "login.html";

        return;

      }


      const currentUser =
        document.getElementById(
          "currentUser"
        );


      const shoppingUser =
        document.getElementById(
          "shoppingUser"
        );


      if(currentUser){

        currentUser.textContent =
          user;

      }


      if(shoppingUser){

        shoppingUser.textContent =
          user;

      }

    }


    /* Dnešný dátum */

    const dateInput =
      document.getElementById(
        "newDate"
      );


    if(
      dateInput &&
      !dateInput.value
    ){

      dateInput.value =
        new Date()
          .toISOString()
          .slice(0,10);

    }

  }
);


/* =====================================================
   ODHLÁSENIE
===================================================== */

function logoutUser(){

  if(
    typeof logout ===
    "function"
  ){

    logout();

    return;

  }


  localStorage.removeItem(
    "loggedInUser"
  );

  localStorage.removeItem(
    "currentUser"
  );

  localStorage.removeItem(
    "user"
  );


  window.location.href =
    "index.html";

}


/* =====================================================
   OCHRANA APP.HTML
===================================================== */

window.addEventListener(
  "pageshow",
  function(){

    if(
      typeof getCurrentUser ===
      "function"
    ){

      if(!getCurrentUser()){

        window.location.href =
          "login.html";

      }

    }

  }
);

</script>


</body>

</html>
