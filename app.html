<!DOCTYPE html>
<html lang="sk">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>🛒 Nákupný kalendár</title>


<style>

*{
  box-sizing:border-box
}

body{
  margin:0;
  background:#f2f4f7;
  color:#222;
  font-family:Arial,sans-serif
}

.app{
  max-width:850px;
  margin:auto;
  padding:16px
}

.card{
  background:#fff;
  border-radius:20px;
  padding:20px;
  box-shadow:0 5px 25px #0001;
  margin-bottom:16px
}

h1{
  text-align:center;
  margin:4px 0 20px
}

h2{
  margin:5px 0 15px
}

button,
input{
  font:inherit;
  border-radius:10px;
  padding:10px;
  border:1px solid #ccc
}

button{
  cursor:pointer
}

.primary{
  background:#222;
  color:#fff;
  border:0
}

.secondary{
  background:#eee;
  border:0
}

.danger{
  background:#d9534f;
  color:#fff;
  border:0
}

.back{
  background:#eee;
  border:0;
  margin-bottom:15px
}

.hidden{
  display:none!important
}


/* =========================
   POUŽÍVATEĽ
========================= */

.user-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;

  margin-bottom:15px;
  padding-bottom:15px;

  border-bottom:1px solid #eee
}

.user-info{
  color:#666;
  font-size:14px
}


/* =========================
   DÁTUMY
========================= */

.date-add{
  display:flex;
  gap:8px;
  margin-bottom:18px
}

.date-add input{
  flex:1
}

.date-list{
  display:grid;
  gap:10px
}

.date-row{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:10px;

  padding:14px;

  border:1px solid #ddd;
  border-radius:14px;

  background:#fafafa
}

.date-info{
  cursor:pointer;
  flex:1
}

.date-info strong{
  font-size:17px
}

.meta{
  color:#777;
  font-size:14px;
  margin-top:4px
}

.actions{
  display:flex;
  gap:7px
}


/* =========================
   NÁKUP
========================= */

.selected-date{
  font-size:18px;
  font-weight:bold;
  margin-bottom:15px
}

.stores{
  display:flex;
  gap:8px;

  overflow-x:auto;

  padding-bottom:10px;
  margin-bottom:15px
}

.store{
  min-width:105px;
  background:#f1f1f1;
  border:0
}

.store.active{
  background:#222;
  color:#fff
}

.add-item{
  display:grid;
  grid-template-columns:1fr 90px 100px;

  gap:8px;

  margin-bottom:18px
}

.item{
  display:flex;
  align-items:center;

  gap:9px;

  padding:12px 0;

  border-bottom:1px solid #eee
}

.item.done .item-name{
  text-decoration:line-through;
  opacity:.5
}

.item-name{
  flex:1
}

.qty{
  display:flex;
  align-items:center;
  gap:5px
}

.qty button{
  width:34px;
  height:34px;

  padding:0;

  background:#eee;
  border:0
}

.edit-item{
  background:#eee;
  border:0;

  padding:9px 11px
}

.delete-item{
  background:#d9534f;
  color:#fff;
  border:0;

  padding:9px 11px
}

.empty{
  text-align:center;
  color:#888;
  padding:28px 10px
}

.bottom{
  display:flex;

  justify-content:space-between;
  align-items:center;

  gap:8px;

  margin-top:18px
}

.shop-title{
  margin:0 0 12px
}

.note{
  font-size:13px;
  color:#777;

  text-align:center;

  margin-top:14px
}


/* =========================
   MOBIL
========================= */

@media(max-width:600px){

  .add-item{
    grid-template-columns:1fr 75px
  }

  .add-item button{
    grid-column:1/-1
  }

  .date-row{
    align-items:flex-start;
    flex-direction:column
  }

  .actions{
    width:100%
  }

  .actions button{
    flex:1
  }

  .user-bar{
    align-items:flex-start;
    flex-direction:column
  }

}

</style>

</head>


<body>


<div class="app">


<!-- =================================
     PREHĽAD DÁTUMOV
================================= -->

<section
  id="datesPage"
  class="card"
>

<div class="user-bar">

  <div class="user-info">

    👤
    <span id="currentUser"></span>

  </div>


  <button
    class="secondary"
    onclick="logout()"
  >
    🚪 Odhlásiť sa
  </button>

</div>


<h1>
  🛒 Nákupný kalendár
</h1>


<div class="date-add">

  <input
    id="newDate"
    type="date"
  >


  <button
    class="primary"
    onclick="addDate()"
  >
    + Pridať dátum
  </button>

</div>


<h2>
  📅 Všetky dátumy
</h2>


<div
  id="dateList"
  class="date-list"
></div>


<div class="note">

  Všetko sa automaticky ukladá
  v tomto prehliadači.

</div>

</section>



<!-- =================================
     DETAIL DŇA
================================= -->

<section
  id="shoppingPage"
  class="card hidden"
>


<div class="user-bar">

  <div class="user-info">

    👤
    <span id="shoppingUser"></span>

  </div>


  <button
    class="secondary"
    onclick="logout()"
  >
    🚪 Odhlásiť sa
  </button>

</div>



<button
  class="back"
  onclick="showDates()"
>
  ← Späť na dátumy
</button>



<div
  id="selectedDate"
  class="selected-date"
></div>



<h2>
  🏪 Obchod
</h2>



<div
  id="stores"
  class="stores"
></div>



<h3
  id="shopTitle"
  class="shop-title"
></h3>



<div class="add-item">


  <input
    id="itemName"
    placeholder="Čo treba kúpiť?"
  >


  <input
    id="itemQty"
    type="number"
    min="1"
    value="1"
  >


  <button
    class="primary"
    onclick="addItem()"
  >
    + Pridať
  </button>


</div>



<div
  id="itemList"
></div>



<div class="bottom">


  <span id="itemCount"></span>


  <button
    class="danger"
    onclick="clearBought()"
  >
    Vymazať kúpené
  </button>


</div>


</section>


</div>



<script>

/* =========================================
   OBCHODY
========================================= */

const STORES = [

  "Lidl",
  "Kaufland",
  "Tesco",
  "Billa",
  "COOP Jednota",
  "Terno",
  "Penny",
  "Iné"

];



/* =========================================
   PRIHLÁSENÝ POUŽÍVATEĽ
========================================= */

let currentUser =
  localStorage.getItem(
    "nakupnyPrihlasenyV1"
  );



/* =========================================
   KONTROLA PRIHLÁSENIA
========================================= */

const users =
  JSON.parse(
    localStorage.getItem(
      "nakupnyPouzivateliaV1"
    ) || "{}"
  );


if(
  !currentUser ||
  !users[currentUser]
){

  window.location.href =
    "login.html";

}



/* =========================================
   DATABÁZA
========================================= */

let database = {};

let currentDate = null;

let currentStore = null;



/* =========================================
   NAČÍTANIE DÁT
========================================= */

function loadUserDatabase(){

  const key =
    "nakupnyKalendárV2_" +
    currentUser;


  try{

    database =
      JSON.parse(
        localStorage.getItem(key)
        || "{}"
      );

  }catch(error){

    database = {};

  }

}



/* =========================================
   ULOŽENIE DÁT
========================================= */

function save(){

  if(!currentUser){

    return;

  }


  const key =
    "nakupnyKalendárV2_" +
    currentUser;


  localStorage.setItem(
    key,
    JSON.stringify(database)
  );

}



/* =========================================
   FORMÁT DÁTUMU
========================================= */

function formatDate(date){

  return new Intl.DateTimeFormat(
    "sk-SK",
    {
      weekday:"long",
      day:"numeric",
      month:"long",
      year:"numeric"
    }
  ).format(
    new Date(
      date + "T12:00:00"
    )
  );

}



function shortDate(date){

  return new Intl.DateTimeFormat(
    "sk-SK",
    {
      day:"numeric",
      month:"numeric",
      year:"numeric"
    }
  ).format(
    new Date(
      date + "T12:00:00"
    )
  );

}



/* =========================================
   VYTVORENIE DÁTUMU
========================================= */

function ensureDate(date){

  if(!database[date]){

    database[date] = {};

  }


  STORES.forEach(
    store => {

      if(
        !Array.isArray(
          database[date][store]
        )
      ){

        database[date][store] = [];

      }

    }
  );

}



/* =========================================
   PRIDAŤ DÁTUM
========================================= */

function addDate(){

  const input =
    document.getElementById(
      "newDate"
    );


  const date =
    input.value;


  if(!date){

    input.focus();

    return;

  }


  ensureDate(date);

  save();

  openDate(date);

}



/* =========================================
   SPÄŤ
========================================= */

function showDates(){

  currentDate = null;

  currentStore = null;


  document
    .getElementById(
      "shoppingPage"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "datesPage"
    )
    .classList.remove(
      "hidden"
    );


  renderDates();

}



/* =========================================
   OTVORIŤ DÁTUM
========================================= */

function openDate(date){

  ensureDate(date);


  currentDate = date;


  currentStore =
    localStorage.getItem(
      "poslednyObchod_" +
      currentUser
    ) || "Lidl";


  if(
    !STORES.includes(
      currentStore
    )
  ){

    currentStore = "Lidl";

  }


  document
    .getElementById(
      "datesPage"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "shoppingPage"
    )
    .classList.remove(
      "hidden"
    );


  document
    .getElementById(
      "selectedDate"
    )
    .textContent =
      "📅 " +
      formatDate(date);


  renderStores();

  renderItems();

}



/* =========================================
   ÚPRAVA DÁTUMU
========================================= */

function editDate(date){

  const value =
    prompt(
      "Uprav dátum (RRRR-MM-DD):",
      date
    );


  if(
    value === null ||
    !/^\d{4}-\d{2}-\d{2}$/.test(
      value
    )
  ){

    return;

  }


  if(value === date){

    return;

  }


  if(database[value]){

    alert(
      "Tento dátum už existuje."
    );

    return;

  }


  database[value] =
    database[date];


  delete database[date];


  save();

  renderDates();

}



/* =========================================
   VYMAZAŤ DÁTUM
========================================= */

function deleteDate(date){

  if(
    confirm(
      "Naozaj chceš vymazať tento dátum a všetky jeho nákupy?"
    )
  ){

    delete database[date];

    save();

    renderDates();

  }

}



/* =========================================
   ZOBRAZENIE DÁTUMOV
========================================= */

function renderDates(){

  const el =
    document.getElementById(
      "dateList"
    );


  const dates =
    Object.keys(database)
      .sort()
      .reverse();


  if(!dates.length){

    el.innerHTML =
      `
      <div class="empty">

        Zatiaľ nemáš žiadny
        nákupný zoznam.

        <br>

        Vyber dátum a pridaj ho.

      </div>
      `;


    return;

  }


  el.innerHTML =
    dates.map(
      date => {

        const total =
          STORES.reduce(
            (sum,store) =>

              sum +
              (
                database[date][store]
                || []
              ).length,

            0
          );


        const bought =
          STORES.reduce(
            (sum,store) =>

              sum +
              (
                database[date][store]
                || []
              ).filter(
                x => x.done
              ).length,

            0
          );


        return `

        <div class="date-row">


          <div
            class="date-info"
            onclick="openDate('${date}')"
          >

            <strong>

              📅
              ${formatDate(date)}

            </strong>


            <div class="meta">

              ${total}
              položiek •

              ${bought}
              kúpených

            </div>

          </div>



          <div class="actions">


            <button
              class="primary"
              onclick="openDate('${date}')"
            >
              Otvoriť
            </button>


            <button
              class="secondary"
              onclick="editDate('${date}')"
            >
              ✏️
            </button>


            <button
              class="danger"
              onclick="deleteDate('${date}')"
            >
              🗑️
            </button>


          </div>


        </div>

        `;

      }
    ).join("");

}



/* =========================================
   OBCHODY
========================================= */

function renderStores(){

  const el =
    document.getElementById(
      "stores"
    );


  el.innerHTML =
    STORES.map(
      store => `

      <button
        class="store ${
          store === currentStore
          ? "active"
          : ""
        }"
        onclick="selectStore('${store}')"
      >

        ${store}

      </button>

      `
    ).join("");


  document
    .getElementById(
      "shopTitle"
    )
    .textContent =
      "🛍️ Nákup v obchode: "
      +
      currentStore;

}



/* =========================================
   VÝBER OBCHODU
========================================= */

function selectStore(store){

  currentStore = store;


  localStorage.setItem(
    "poslednyObchod_" +
    currentUser,

    store
  );


  ensureDate(
    currentDate
  );


  save();

  renderStores();

  renderItems();

}



/* =========================================
   PRIDAŤ POLOŽKU
========================================= */

function addItem(){

  const nameInput =
    document.getElementById(
      "itemName"
    );


  const qtyInput =
    document.getElementById(
      "itemQty"
    );


  const name =
    nameInput.value.trim();


  const qty =
    Math.max(
      1,
      parseInt(
        qtyInput.value
      ) || 1
    );


  if(!name){

    nameInput.focus();

    return;

  }


  database
    [currentDate]
    [currentStore]
    .push({

      id:
        Date.now() +
        Math.random(),

      name:
        name,

      quantity:
        qty,

      done:
        false

    });


  save();


  nameInput.value = "";

  qtyInput.value = 1;


  renderItems();

  nameInput.focus();

}



/* =========================================
   MNOŽSTVO
========================================= */

function changeQty(
  id,
  change
){

  const item =
    findItem(id);


  if(!item){

    return;

  }


  item.quantity =
    Math.max(
      1,
      item.quantity +
      change
    );


  save();

  renderItems();

}



/* =========================================
   KÚPENÉ
========================================= */

function toggleItem(id){

  const item =
    findItem(id);


  if(!item){

    return;

  }


  item.done =
    !item.done;


  save();

  renderItems();

}



/* =========================================
   ÚPRAVA POLOŽKY
========================================= */

function editItem(id){

  const item =
    findItem(id);


  if(!item){

    return;

  }


  const newName =
    prompt(
      "Uprav názov položky:",
      item.name
    );


  if(newName === null){

    return;

  }


  const name =
    newName.trim();


  if(!name){

    return;

  }


  const newQty =
    prompt(
      "Uprav počet kusov:",
      item.quantity
    );


  if(newQty === null){

    return;

  }


  const qty =
    Math.max(
      1,
      parseInt(
        newQty
      ) || 1
    );


  item.name =
    name;


  item.quantity =
    qty;


  save();

  renderItems();

}



/* =========================================
   VYMAZAŤ POLOŽKU
========================================= */

function deleteItem(id){

  database
    [currentDate]
    [currentStore] =

    database
      [currentDate]
      [currentStore]
      .filter(
        item =>
          item.id !== id
      );


  save();

  renderItems();

}



/* =========================================
   VYMAZAŤ KÚPENÉ
========================================= */

function clearBought(){

  database
    [currentDate]
    [currentStore] =

    database
      [currentDate]
      [currentStore]
      .filter(
        item =>
          !item.done
      );


  save();

  renderItems();

}



/* =========================================
   NÁJSŤ POLOŽKU
========================================= */

function findItem(id){

  return database
    [currentDate]
    [currentStore]
    .find(
      item =>
        item.id === id
    );

}



/* =========================================
   ZOBRAZENIE POLOŽIEK
========================================= */

function renderItems(){

  const items =
    database
      [currentDate]
      [currentStore]
      || [];


  const list =
    document.getElementById(
      "itemList"
    );


  if(!items.length){

    list.innerHTML =
      `
      <div class="empty">

        V tomto obchode
        zatiaľ nič nemáš.

      </div>
      `;

  }else{

    list.innerHTML =
      items.map(
        item => `

        <div
          class="item ${
            item.done
            ? "done"
            : ""
          }"
        >


          <input
            type="checkbox"

            ${
              item.done
              ? "checked"
              : ""
            }

            onchange=
              "toggleItem(${item.id})"
          >



          <span class="item-name">

            ${escapeHtml(
              item.name
            )}

          </span>



          <div class="qty">


            <button
              onclick=
                "changeQty(${item.id},-1)"
            >
              −
            </button>


            <b>
              ${item.quantity}
            </b>


            <button
              onclick=
                "changeQty(${item.id},1)"
            >
              +
            </button>


          </div>



          <button
            class="edit-item"
            onclick=
              "editItem(${item.id})"
          >
            ✏️
          </button>



          <button
            class="delete-item"
            onclick=
              "deleteItem(${item.id})"
          >
            🗑️
          </button>


        </div>

        `
      ).join("");

  }


  const bought =
    items.filter(
      x =>
        x.done
    ).length;


  document
    .getElementById(
      "itemCount"
    )
    .textContent =

      `${items.length}
       položiek •
       ${bought}
       kúpených`;

}



/* =========================================
   OCHRANA HTML
========================================= */

function escapeHtml(text){

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text;


  return div.innerHTML;

}



/* =========================================
   ODHLÁSENIE
========================================= */

function logout(){

  currentUser = null;

  currentDate = null;

  currentStore = null;

  database = {};


  localStorage.removeItem(
    "nakupnyPrihlasenyV1"
  );


  window.location.href =
    "login.html";

}



/* =========================================
   ENTER
========================================= */

document
  .getElementById(
    "itemName"
  )
  .addEventListener(
    "keydown",
    event => {

      if(
        event.key === "Enter"
      ){

        addItem();

      }

    }
  );


document
  .getElementById(
    "itemQty"
  )
  .addEventListener(
    "keydown",
    event => {

      if(
        event.key === "Enter"
      ){

        addItem();

      }

    }
  );



/* =========================================
   SPUSTENIE
========================================= */

loadUserDatabase();


document
  .getElementById(
    "currentUser"
  )
  .textContent =
    currentUser;


document
  .getElementById(
    "shoppingUser"
  )
  .textContent =
    currentUser;



const today =
  new Date()
    .toISOString()
    .slice(
      0,
      10
    );


document
  .getElementById(
    "newDate"
  )
  .value =
    today;


renderDates();

</script>

</body>
</html>
