<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🛒 Nákupný kalendár</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f2f4f7;
  color:#222;
  font-family:Arial,sans-serif
}

.app{
  max-width:900px;
  margin:auto;
  padding:16px
}

.card{
  background:#fff;
  border-radius:20px;
  padding:20px;
  box-shadow:0 5px 25px #0001;
  margin-bottom:16px
}

h1{
  text-align:center;
  margin:4px 0 20px
}

h2{
  margin:5px 0 15px
}

button,input{
  font:inherit;
  border-radius:10px;
  padding:10px;
  border:1px solid #ccc
}

button{
  cursor:pointer
}

.primary{
  background:#222;
  color:#fff;
  border:0
}

.secondary{
  background:#eee;
  border:0
}

.danger{
  background:#d9534f;
  color:#fff;
  border:0
}

.back{
  background:#eee;
  border:0;
  margin-bottom:15px
}

.hidden{
  display:none!important
}


/* =========================
   MAPA
========================= */

.map-controls{
  display:flex;
  gap:8px;
  margin-bottom:10px
}

.map-controls button{
  flex:1
}

.map-status{
  background:#f1f1f1;
  padding:10px;
  border-radius:10px;
  margin-bottom:10px;
  font-size:14px
}

#map{
  width:100%;
  height:500px;
  border-radius:16px;
  overflow:hidden;
  border:1px solid #ddd
}


/* =========================
   IKONA PREDAJNE
========================= */

.shop-icon{
  width:44px;
  height:44px;

  border-radius:50%;

  background:#fff;

  border:2px solid #222;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  box-shadow:0 2px 8px #0005
}

.shop-icon img{
  width:36px;
  height:36px;
  object-fit:contain
}


/* =========================
   POPUP
========================= */

.store-popup{
  min-width:240px;
  text-align:center
}

.store-popup img{
  width:55px;
  height:55px;
  object-fit:contain
}

.store-popup h3{
  margin:5px 0 8px
}

.store-popup p{
  margin:7px 0
}

.store-popup button{
  width:100%;
  margin-top:7px
}


/* =========================
   DÁTUMY
========================= */

.date-add{
  display:flex;
  gap:8px;
  margin-bottom:18px
}

.date-add input{
  flex:1
}

.date-list{
  display:grid;
  gap:10px
}

.date-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;

  padding:14px;

  border:1px solid #ddd;
  border-radius:14px;

  background:#fafafa
}

.date-info{
  cursor:pointer;
  flex:1
}

.date-info strong{
  font-size:17px
}

.meta{
  color:#777;
  font-size:14px;
  margin-top:4px
}

.actions{
  display:flex;
  gap:7px
}


/* =========================
   NÁKUP
========================= */

.selected-date{
  font-size:18px;
  font-weight:bold;
  margin-bottom:15px
}

.stores{
  display:flex;
  gap:8px;

  overflow-x:auto;

  padding-bottom:10px;
  margin-bottom:15px
}

.store{
  min-width:105px;
  background:#f1f1f1;
  border:0
}

.store.active{
  background:#222;
  color:#fff
}

.add-item{
  display:grid;

  grid-template-columns:
    1fr 90px 100px;

  gap:8px;

  margin-bottom:18px
}

.item{
  display:flex;
  align-items:center;
  gap:9px;

  padding:12px 0;

  border-bottom:1px solid #eee
}

.item.done .item-name{
  text-decoration:line-through;
  opacity:.5
}

.item-name{
  flex:1
}

.qty{
  display:flex;
  align-items:center;
  gap:5px
}

.qty button{
  width:34px;
  height:34px;

  padding:0;

  background:#eee;

  border:0
}

.edit-item{
  background:#eee;
  border:0;
  padding:9px 11px
}

.delete-item{
  background:#d9534f;
  color:#fff;
  border:0;
  padding:9px 11px
}

.empty{
  text-align:center;
  color:#888;
  padding:28px 10px
}

.bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-top:18px
}

.shop-title{
  margin:0 0 12px
}

.note{
  font-size:13px;
  color:#777;
  text-align:center;
  margin-top:14px
}


@media(max-width:600px){

  .add-item{
    grid-template-columns:1fr 75px
  }

  .add-item button{
    grid-column:1/-1
  }

  .date-row{
    align-items:flex-start;
    flex-direction:column
  }

  .actions{
    width:100%
  }

  .actions button{
    flex:1
  }

  #map{
    height:430px
  }

}
</style>
</head>


<body>

<div class="app">


<!-- ==================================================
     MAPA
================================================== -->

<section class="card">

<h1>🛒 Nákupný kalendár</h1>

<h2>🗺️ Predajne</h2>

<div class="map-controls">

<button
  class="primary"
  onclick="mojaPoloha()"
>
  📍 Moja poloha
</button>

</div>

<div
  id="mapStatus"
  class="map-status"
>
  🗺️ Mapa sa načítava...
</div>

<div id="map"></div>

</section>



<!-- ==================================================
     DÁTUMY
================================================== -->

<section
  id="datesPage"
  class="card"
>

<h2>📅 Všetky dátumy</h2>

<div class="date-add">

<input
  id="newDate"
  type="date"
>

<button
  class="primary"
  onclick="addDate()"
>
  + Pridať dátum
</button>

</div>

<div
  id="dateList"
  class="date-list"
></div>

<div class="note">
  Všetko sa automaticky ukladá v tomto prehliadači.
</div>

</section>



<!-- ==================================================
     DETAIL DŇA
================================================== -->

<section
  id="shoppingPage"
  class="card hidden"
>

<button
  class="back"
  onclick="showDates()"
>
  ← Späť na dátumy
</button>

<div
  id="selectedDate"
  class="selected-date"
></div>


<h2>🏪 Obchod</h2>

<div
  id="stores"
  class="stores"
></div>


<h3
  id="shopTitle"
  class="shop-title"
></h3>


<div class="add-item">

<input
  id="itemName"
  placeholder="Čo treba kúpiť?"
>

<input
  id="itemQty"
  type="number"
  min="1"
  value="1"
>

<button
  class="primary"
  onclick="addItem()"
>
  + Pridať
</button>

</div>


<div id="itemList"></div>


<div class="bottom">

<span id="itemCount"></span>

<button
  class="danger"
  onclick="clearBought()"
>
  Vymazať kúpené
</button>

</div>

</section>

</div>



<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* ==================================================
   OBCHODY V NÁKUPNOM ZOZNAME
================================================== */

const STORES=[
  "Lidl",
  "Kaufland",
  "Tesco",
  "Billa",
  "COOP Jednota",
  "Terno",
  "Penny",
  "Iné"
];


let database=
  JSON.parse(
    localStorage.getItem(
      "nakupnyKalendárV2"
    ) || "{}"
  );


let currentDate=null;
let currentStore=null;


/* ==================================================
   ULOŽENIE
================================================== */

function save(){

  localStorage.setItem(
    "nakupnyKalendárV2",
    JSON.stringify(database)
  );

}


/* ==================================================
   DÁTUM
================================================== */

function formatDate(date){

  return new Intl.DateTimeFormat(
    "sk-SK",
    {
      weekday:"long",
      day:"numeric",
      month:"long",
      year:"numeric"
    }
  ).format(
    new Date(date+"T12:00:00")
  );

}


function shortDate(date){

  return new Intl.DateTimeFormat(
    "sk-SK",
    {
      day:"numeric",
      month:"numeric",
      year:"numeric"
    }
  ).format(
    new Date(date+"T12:00:00")
  );

}


/* ==================================================
   ZAISTIŤ DÁTUM
================================================== */

function ensureDate(date){

  if(!database[date]){
    database[date]={};
  }

  STORES.forEach(store=>{

    if(
      !Array.isArray(
        database[date][store]
      )
    ){

      database[date][store]=[];

    }

  });

}


/* ==================================================
   PRIDAŤ DÁTUM
================================================== */

function addDate(){

  const input=
    document.getElementById(
      "newDate"
    );

  const date=input.value;

  if(!date){

    input.focus();
    return;

  }

  ensureDate(date);

  save();

  openDate(date);

}


/* ==================================================
   SPÄŤ NA DÁTUMY
================================================== */

function showDates(){

  currentDate=null;
  currentStore=null;

  document
    .getElementById(
      "shoppingPage"
    )
    .classList.add(
      "hidden"
    );

  document
    .getElementById(
      "datesPage"
    )
    .classList.remove(
      "hidden"
    );

  renderDates();

}


/* ==================================================
   OTVORIŤ DÁTUM
================================================== */

function openDate(date){

  ensureDate(date);

  currentDate=date;

  currentStore=
    localStorage.getItem(
      "poslednyObchod"
    ) || "Lidl";

  if(
    !STORES.includes(
      currentStore
    )
  ){

    currentStore="Lidl";

  }


  document
    .getElementById(
      "datesPage"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "shoppingPage"
    )
    .classList.remove(
      "hidden"
    );


  document
    .getElementById(
      "selectedDate"
    )
    .textContent=
      "📅 "+formatDate(date);


  renderStores();
  renderItems();

}


/* ==================================================
   UPRAVIŤ DÁTUM
================================================== */

function editDate(date){

  const value=
    prompt(
      "Uprav dátum (RRRR-MM-DD):",
      date
    );

  if(
    value===null ||
    !/^\d{4}-\d{2}-\d{2}$/.test(value)
  ){

    return;

  }

  if(value===date){

    return;

  }

  if(database[value]){

    alert(
      "Tento dátum už existuje."
    );

    return;

  }

  database[value]=database[date];

  delete database[date];

  save();

  renderDates();

}


/* ==================================================
   VYMAZAŤ DÁTUM
================================================== */

function deleteDate(date){

  if(
    confirm(
      "Naozaj chceš vymazať tento dátum a všetky jeho nákupy?"
    )
  ){

    delete database[date];

    save();

    renderDates();

  }

}


/* ==================================================
   VYKRESLIŤ DÁTUMY
================================================== */

function renderDates(){

  const el=
    document.getElementById(
      "dateList"
    );

  const dates=
    Object.keys(database)
      .sort()
      .reverse();


  if(!dates.length){

    el.innerHTML=
      `
      <div class="empty">

        Zatiaľ nemáš žiadny
        nákupný zoznam.

        <br>

        Vyber dátum a pridaj ho.

      </div>
      `;

    return;

  }


  el.innerHTML=
    dates.map(date=>{

      const total=
        STORES.reduce(
          (sum,store)=>
            sum+
            (
              database[date][store]
              || []
            ).length,
          0
        );


      const bought=
        STORES.reduce(
          (sum,store)=>
            sum+
            (
              database[date][store]
              || []
            ).filter(
              x=>x.done
            ).length,
          0
        );


      return `

      <div class="date-row">

        <div
          class="date-info"
          onclick="openDate('${date}')"
        >

          <strong>
            📅 ${formatDate(date)}
          </strong>

          <div class="meta">
            ${total} položiek •
            ${bought} kúpených
          </div>

        </div>


        <div class="actions">

          <button
            class="primary"
            onclick="openDate('${date}')"
          >
            Otvoriť
          </button>

          <button
            class="secondary"
            onclick="editDate('${date}')"
          >
            ✏️
          </button>

          <button
            class="danger"
            onclick="deleteDate('${date}')"
          >
            🗑️
          </button>

        </div>

      </div>

      `;

    }).join("");

}


/* ==================================================
   VYKRESLIŤ OBCHODY
================================================== */

function renderStores(){

  const el=
    document.getElementById(
      "stores"
    );


  el.innerHTML=
    STORES.map(store=>`

      <button
        class="store ${
          store===currentStore
            ? "active"
            : ""
        }"
        onclick="selectStore('${store}')"
      >
        ${store}
      </button>

    `).join("");


  document
    .getElementById(
      "shopTitle"
    )
    .textContent=
      "🛍️ Nákup v obchode: "
      +currentStore;

}


/* ==================================================
   VYBRAŤ OBCHOD
================================================== */

function selectStore(store){

  currentStore=store;

  localStorage.setItem(
    "poslednyObchod",
    store
  );

  ensureDate(currentDate);

  save();

  renderStores();
  renderItems();

}


/* ==================================================
   PRIDAŤ POLOŽKU
================================================== */

function addItem(){

  const nameInput=
    document.getElementById(
      "itemName"
    );

  const qtyInput=
    document.getElementById(
      "itemQty"
    );


  const name=
    nameInput.value.trim();


  const qty=
    Math.max(
      1,
      parseInt(
        qtyInput.value
      ) || 1
    );


  if(!name){

    nameInput.focus();
    return;

  }


  database
    [currentDate]
    [currentStore]
    .push({

      id:
        Date.now()
        +
        Math.random(),

      name:name,

      quantity:qty,

      done:false

    });


  save();

  nameInput.value="";
  qtyInput.value=1;

  renderItems();

  nameInput.focus();

}


/* ==================================================
   ZMENA MNOŽSTVA
================================================== */

function changeQty(id,change){

  const item=
    findItem(id);

  if(!item)return;

  item.quantity=
    Math.max(
      1,
      item.quantity+change
    );

  save();

  renderItems();

}


/* ==================================================
   KÚPENÉ
================================================== */

function toggleItem(id){

  const item=
    findItem(id);

  if(!item)return;

  item.done=
    !item.done;

  save();

  renderItems();

}


/* ==================================================
   UPRAVIŤ POLOŽKU
================================================== */

function editItem(id){

  const item=
    findItem(id);

  if(!item)return;


  const newName=
    prompt(
      "Uprav názov položky:",
      item.name
    );

  if(newName===null)return;


  const name=
    newName.trim();

  if(!name)return;


  const newQty=
    prompt(
      "Uprav počet kusov:",
      item.quantity
    );

  if(newQty===null)return;


  const qty=
    Math.max(
      1,
      parseInt(newQty) || 1
    );


  item.name=name;
  item.quantity=qty;

  save();

  renderItems();

}


/* ==================================================
   VYMAZAŤ POLOŽKU
================================================== */

function deleteItem(id){

  database
    [currentDate]
    [currentStore]=

      database
        [currentDate]
        [currentStore]
        .filter(
          item=>item.id!==id
        );


  save();

  renderItems();

}


/* ==================================================
   VYMAZAŤ KÚPENÉ
================================================== */

function clearBought(){

  database
    [currentDate]
    [currentStore]=

      database
        [currentDate]
        [currentStore]
        .filter(
          item=>!item.done
        );


  save();

  renderItems();

}


/* ==================================================
   NÁJSŤ POLOŽKU
================================================== */

function findItem(id){

  return database
    [currentDate]
    [currentStore]
    .find(
      item=>item.id===id
    );

}


/* ==================================================
   VYKRESLIŤ POLOŽKY
================================================== */

function renderItems(){

  const items=
    database
      [currentDate]
      [currentStore]
      || [];


  const list=
    document.getElementById(
      "itemList"
    );


  if(!items.length){

    list.innerHTML=
      `
      <div class="empty">

        V tomto obchode
        zatiaľ nič nemáš.

      </div>
      `;

  }else{

    list.innerHTML=
      items.map(item=>`

        <div
          class="item ${
            item.done
              ? "done"
              : ""
          }"
        >

          <input
            type="checkbox"
            ${
              item.done
                ? "checked"
                : ""
            }
            onchange="
              toggleItem(
                ${item.id}
              )
            "
          >


          <span class="item-name">

            ${escapeHtml(
              item.name
            )}

          </span>


          <div class="qty">

            <button
              onclick="
                changeQty(
                  ${item.id},
                  -1
                )
              "
            >
              −
            </button>

            <b>
              ${item.quantity}
            </b>

            <button
              onclick="
                changeQty(
                  ${item.id},
                  1
                )
              "
            >
              +
            </button>

          </div>


          <button
            class="edit-item"
            onclick="
              editItem(
                ${item.id}
              )
            "
          >
            ✏️
          </button>


          <button
            class="delete-item"
            onclick="
              deleteItem(
                ${item.id}
              )
            "
          >
            🗑️
          </button>

        </div>

      `).join("");

  }


  const bought=
    items.filter(
      x=>x.done
    ).length;


  document
    .getElementById(
      "itemCount"
    )
    .textContent=
      `${items.length}
       položiek •
       ${bought}
       kúpených`;

}


/* ==================================================
   OCHRANA HTML
================================================== */

function escapeHtml(text){

  const div=
    document.createElement(
      "div"
    );

  div.textContent=text;

  return div.innerHTML;

}


/* ==================================================
   ENTER
================================================== */

document
  .getElementById(
    "itemName"
  )
  .addEventListener(
    "keydown",
    e=>{

      if(e.key==="Enter")
        addItem();

    }
  );


document
  .getElementById(
    "itemQty"
  )
  .addEventListener(
    "keydown",
    e=>{

      if(e.key==="Enter")
        addItem();

    }
  );


/* ==================================================
   DNES
================================================== */

const today=
  new Date()
    .toISOString()
    .slice(0,10);


document
  .getElementById(
    "newDate"
  )
  .value=today;


renderDates();



/* ==================================================
   PREDAJNE NA MAPE
================================================== */

const PREDAJNE=[

    lng:18.554310,

    logo:
      "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQt9pQfLGEs_tQf5ibTwOy4DkQe8Fr3QbafzXBxWlMk9A&s=10",

    hodiny:{

      1:["06:00","19:00"],
      2:["06:00","19:00"],
      3:["06:00","19:00"],
      4:["06:00","19:00"],
      5:["06:00","19:00"],
      6:["06:00","14:00"],
      0:["07:00","12:00"]

    }

  }

];



/* ==================================================
   STAV PREDAJNE
================================================== */

function stavPredajne(
  predajna
){

  const teraz=
    new Date();

  const den=
    teraz.getDay();

  const cas=
    teraz.getHours()*60
    +
    teraz.getMinutes();

  const hodiny=
    predajna.hodiny[den];


  if(!hodiny){

    return {
      otvorene:false,
      text:"🔴 Zatvorené"
    };

  }


  const od=
    hodiny[0]
      .split(":")
      .map(Number);


  const doCas=
    hodiny[1]
      .split(":")
      .map(Number);


  const odMin=
    od[0]*60+
    od[1];


  const doMin=
    doCas[0]*60+
    doCas[1];


  const otvorene=
    cas>=odMin &&
    cas<doMin;


  return {

    otvorene:otvorene,

    text:
      otvorene
        ? "🟢 Otvorené"
        : "🔴 Zatvorené"

  };

}


/* ==================================================
   OTVÁRACIE HODINY
================================================== */

function formatHodiny(
  predajna
){

  return `

    <div>
      <b>Po–Pi:</b>
      ${predajna.hodiny[1][0]}
      –
      ${predajna.hodiny[1][1]}
    </div>

    <div>
      <b>Sobota:</b>
      ${predajna.hodiny[6][0]}
      –
      ${predajna.hodiny[6][1]}
    </div>

    <div>
      <b>Nedeľa:</b>
      ${predajna.hodiny[0][0]}
      –
      ${predajna.hodiny[0][1]}
    </div>

  `;

}


/* ==================================================
   MAPA
================================================== */

let mapa=null;

let markerMojaPoloha=null;


/* ==================================================
   IKONA
================================================== */

function vytvorIkonu(
  predajna
){

  return L.divIcon({

    className:"",

    html:`

      <div class="shop-icon">

        <img
          src="${predajna.logo}"
          alt="${escapeHtml(
            predajna.obchod
          )}"
        >

      </div>

    `,

    iconSize:[44,44],

    iconAnchor:[22,22],

    popupAnchor:[0,-22]

  });

}


/* ==================================================
   POPUP
================================================== */

function vytvorPopup(
  predajna
){

  const stav=
    stavPredajne(
      predajna
    );


  return `

    <div class="store-popup">

      <img
        src="${predajna.logo}"
        alt="${escapeHtml(
          predajna.obchod
        )}"
      >

      <h3>
        ${escapeHtml(
          predajna.nazov
        )}
      </h3>

      <p>
        <b>${stav.text}</b>
      </p>

      <p>
        🏪
        ${escapeHtml(
          predajna.obchod
        )}
      </p>

      <p>
        📍
        ${escapeHtml(
          predajna.adresa
        )}
      </p>

      <p>
        🕒
        <b>Otváracie hodiny</b>
      </p>

      ${formatHodiny(
        predajna
      )}

      <button
        class="primary"
        onclick="
          vybratObchodZMapy(
            '${predajna.obchod}'
          )
        "
      >
        🛒 Vybrať obchod
      </button>

      <button
        class="secondary"
        onclick="
          navigovat(
            ${predajna.lat},
            ${predajna.lng}
          )
        "
      >
        🧭 Navigovať
      </button>

    </div>

  `;

}


/* ==================================================
   SPUSTIŤ MAPU
================================================== */

function spustitMapu(){

  if(
    typeof L==="undefined"
  ){

    document
      .getElementById(
        "mapStatus"
      )
      .textContent=
        "⚠️ Mapa sa nenačítala.";

    return;

  }


  if(mapa){

    mapa.invalidateSize();

    return;

  }


  mapa=
    L.map(
      "map"
    ).setView(

      [
        49.220,
        18.560
      ],

      14

    );


  L.tileLayer(

    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

    {

      maxZoom:19,

      attribution:
        "© OpenStreetMap"

    }

  ).addTo(
    mapa
  );


  L.control
    .scale()
    .addTo(
      mapa
    );


  PREDAJNE.forEach(
    predajna=>{

      const marker=

        L.marker(

          [
            predajna.lat,
            predajna.lng
          ],

          {
            icon:
              vytvorIkonu(
                predajna
              )
          }

        ).addTo(
          mapa
        );


      marker.bindPopup(

        vytvorPopup(
          predajna
        )

      );

    }
  );


  document
    .getElementById(
      "mapStatus"
    )
    .textContent=
      "🗺️ Vyber predajňu na mape.";

}


/* ==================================================
   MOJA POLOHA
================================================== */

function mojaPoloha(){

  if(!mapa){

    spustitMapu();

  }


  if(
    !navigator.geolocation
  ){

    alert(
      "Tento prehliadač nepodporuje určovanie polohy."
    );

    return;

  }


  document
    .getElementById(
      "mapStatus"
    )
    .textContent=
      "📍 Zisťujem tvoju polohu...";


  navigator.geolocation.getCurrentPosition(

    function(position){

      const lat=
        position.coords.latitude;

      const lng=
        position.coords.longitude;


      if(
        markerMojaPoloha
      ){

        mapa.removeLayer(
          markerMojaPoloha
        );

      }


      markerMojaPoloha=

        L.marker(

          [
            lat,
            lng
          ]

        ).addTo(
          mapa
        );


      markerMojaPoloha
        .bindPopup(
          "<b>📍 Moja poloha</b>"
        )
        .openPopup();


      mapa.setView(

        [
          lat,
          lng
        ],

        16

      );


      document
        .getElementById(
          "mapStatus"
        )
        .textContent=
          "📍 Tvoja poloha bola nájdená.";

    },


    function(){

      document
        .getElementById(
          "mapStatus"
        )
        .textContent=
          "⚠️ Povoľ prehliadaču prístup k polohe.";

    },


    {

      enableHighAccuracy:true,

      timeout:15000,

      maximumAge:0

    }

  );

}


/* ==================================================
   NAVIGÁCIA
================================================== */

function navigovat(
  lat,
  lng
){

  const url=

    "https://www.google.com/maps/dir/?api=1&destination="
    +
    lat
    +
    ","
    +
    lng;


  window.open(
    url,
    "_blank"
  );

}


/* ==================================================
   VYBRAŤ OBCHOD Z MAPY
================================================== */

function vybratObchodZMapy(
  obchod
){

  if(!currentDate){

    alert(
      "Najprv pridaj alebo otvor dátum nákupu."
    );

    return;

  }


  selectStore(
    obchod
  );


  document
    .getElementById(
      "shoppingPage"
    )
    .scrollIntoView({

      behavior:"smooth"

    });

}


/* ==================================================
   OBNOVA STAVU PREDAJNE
================================================== */

function obnovitStavy(){

  if(!mapa)return;


  mapa.eachLayer(
    layer=>{

      if(

        layer instanceof L.Marker
        &&
        layer.getLatLng
        &&
        layer.getPopup()

      ){

        const pozicia=
          layer.getLatLng();


        const predajna=

          PREDAJNE.find(
            p=>

              Math.abs(
                p.lat-
                pozicia.lat
              ) < 0.000001

              &&

              Math.abs(
                p.lng-
                pozicia.lng
              ) < 0.000001
          );


        if(predajna){

          layer.setPopupContent(

            vytvorPopup(
              predajna
            )

          );

        }

      }

    }
  );

}


/* ==================================================
   NAČÍTANIE MAPY
================================================== */

window.addEventListener(

  "load",

  function(){

    setTimeout(
      function(){

        spustitMapu();

      },
      100
    );

  }

);


/* ==================================================
   KAŽDÚ MINÚTU AKTUALIZÁCIA
================================================== */

setInterval(
  obnovitStavy,
  60000
);

</script>
