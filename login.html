<!DOCTYPE html>
<html lang="sk">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>🔑 Prihlásenie – Nákupný kalendár</title>


<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#f2f4f7;
  color:#222;

  font-family:Arial,sans-serif;

  padding:16px;
}

.card{
  width:100%;
  max-width:430px;

  background:#fff;

  border-radius:20px;

  padding:28px;

  box-shadow:0 5px 25px #0001;
}

h1{
  text-align:center;
  margin:0 0 10px;
}

.subtitle{
  text-align:center;
  color:#777;
  margin-bottom:25px;
}

.form{
  display:grid;
  gap:12px;
}

input,
button{
  width:100%;

  font:inherit;

  border-radius:10px;

  padding:12px;

  border:1px solid #ccc;
}

input:focus{
  outline:none;
  border-color:#222;
}

button{
  cursor:pointer;
}

.primary{
  background:#222;
  color:#fff;
  border:0;
  margin-top:5px;
}

.primary:hover{
  opacity:.9;
}

.primary:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  padding:11px;
  border-radius:10px;
  background:#f1f1f1;
  text-align:center;
  margin-bottom:12px;
  font-size:14px;
}

.message.error{
  background:#ffe5e5;
  color:#b00000;
}

.message.success{
  background:#e3f7e8;
  color:#176b2c;
}

.hidden{
  display:none;
}

.register{
  text-align:center;
  margin-top:20px;
  color:#777;
}

.register button{
  width:auto;
  padding:0;
  border:0;
  background:none;
  font-weight:bold;
  color:#222;
}

.logo{
  text-align:center;
  font-size:45px;
  margin-bottom:8px;
}

</style>

</head>


<body>


<div class="card">


  <div class="logo">
    🛒
  </div>


  <h1>
    Nákupný kalendár
  </h1>


  <div class="subtitle">
    Prihlás sa do svojho účtu
  </div>



  <div
    id="message"
    class="message hidden"
  ></div>



  <form
    id="loginForm"
    class="form"
  >


    <input
      id="email"
      type="email"
      placeholder="E-mail"
      autocomplete="email"
      required
    >


    <input
      id="password"
      type="password"
      placeholder="Heslo"
      autocomplete="current-password"
      required
    >


    <button
      id="loginButton"
      type="submit"
      class="primary"
    >

      🔑 Prihlásiť sa

    </button>


  </form>



  <div class="register">

    Nemáš ešte účet?

    <button
      type="button"
      onclick="goToRegister()"
    >

      Zaregistrovať sa

    </button>

  </div>


</div>



<!-- =====================================
     FIREBASE SDK
===================================== -->

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>



<!-- =====================================
     FIREBASE AUTH.JS
===================================== -->

<script src="js/auth.js"></script>



<script>


/*
=========================================
  ELEMENTY
=========================================
*/

const loginForm =
  document.getElementById(
    "loginForm"
  );


const message =
  document.getElementById(
    "message"
  );


const loginButton =
  document.getElementById(
    "loginButton"
  );



/*
=========================================
  PRIHLÁSENIE
=========================================
*/

loginForm.addEventListener(

  "submit",

  async function(event){

    event.preventDefault();



    /*
    -------------------------------------
      E-MAIL
    -------------------------------------
    */

    const email =

      document
        .getElementById(
          "email"
        )
        .value
        .trim()
        .toLowerCase();



    /*
    -------------------------------------
      HESLO
    -------------------------------------
    */

    const password =

      document
        .getElementById(
          "password"
        )
        .value;



    /*
    -------------------------------------
      KONTROLA FIREBASE
    -------------------------------------
    */

    if(
      typeof loginUser !==
      "function"
    ){

      showMessage(
        "Firebase sa nepodarilo načítať.",
        "error"
      );

      return;

    }



    /*
    -------------------------------------
      BLOKOVANIE TLAČIDLA
    -------------------------------------
    */

    loginButton.disabled =
      true;


    loginButton.textContent =
      "⏳ Prihlasujem...";



    showMessage(
      "Kontrolujem údaje...",
      ""
    );



    try{


      /*
      -----------------------------------
        PRIHLÁSENIE CEZ FIREBASE
      -----------------------------------
      */

      const result =

        await loginUser(
          email,
          password
        );



      /*
      -----------------------------------
        NEÚSPEŠNÉ PRIHLÁSENIE
      -----------------------------------
      */

      if(
        !result ||
        !result.success
      ){

        showMessage(
          result &&
          result.message
            ? result.message
            : "Nesprávny e-mail alebo heslo.",
          "error"
        );


        loginButton.disabled =
          false;


        loginButton.textContent =
          "🔑 Prihlásiť sa";


        return;

      }



      /*
      -----------------------------------
        ÚSPEŠNÉ PRIHLÁSENIE
      -----------------------------------
      */

      showMessage(
        "✅ Prihlásenie úspešné!",
        "success"
      );



      /*
      -----------------------------------
        PRESMEROVANIE
      -----------------------------------
      */

      setTimeout(

        function(){

          window.location.href =
            "app.html";

        },

        700

      );


    }catch(error){


      console.error(
        "Chyba prihlásenia:",
        error
      );


      /*
      -----------------------------------
        FIREBASE CHYBOVÁ SPRÁVA
      -----------------------------------
      */

      let errorMessage =
        "Nepodarilo sa prihlásiť.";


      if(
        typeof getErrorMessage ===
        "function"
      ){

        errorMessage =
          getErrorMessage(
            error
          );

      }else if(
        error &&
        error.message
      ){

        errorMessage =
          error.message;

      }


      showMessage(
        errorMessage,
        "error"
      );


      loginButton.disabled =
        false;


      loginButton.textContent =
        "🔑 Prihlásiť sa";

    }


  }

);



/*
=========================================
  ZOBRAZENIE SPRÁVY
=========================================
*/

function showMessage(
  text,
  type
){

  message.textContent =
    text;


  message.classList.remove(
    "hidden",
    "error",
    "success"
  );


  if(type){

    message.classList.add(
      type
    );

  }

}



/*
=========================================
  PRECHOD NA REGISTRÁCIU
=========================================
*/

function goToRegister(){

  window.location.href =
    "register.html";

}



/*
=========================================
  KONTROLA,
  ČI JE POUŽÍVATEĽ PRIHLÁSENÝ
=========================================
*/

async function checkAlreadyLoggedIn(){

  try{


    /*
    -------------------------------------
      KONTROLA FUNKCIE
    -------------------------------------
    */

    if(
      typeof getCurrentUser !==
      "function"
    ){

      return;

    }



    /*
    -------------------------------------
      OKAMŽITÁ KONTROLA
    -------------------------------------
    */

    const user =
      getCurrentUser();



    if(user){

      window.location.href =
        "app.html";

      return;

    }



    /*
    -------------------------------------
      FIREBASE MÔŽE EŠTE NAČÍTAVAŤ
      STAV PRIHLÁSENIA
    -------------------------------------
    */

    if(
      typeof waitForAuth ===
      "function"
    ){

      const loadedUser =
        await waitForAuth();


      if(loadedUser){

        window.location.href =
          "app.html";

      }

    }


  }catch(error){

    console.log(
      "Používateľ nie je prihlásený."
    );

  }

}


checkAlreadyLoggedIn();


</script>


</body>

</html>
