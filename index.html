  🛒 Nákupný kalendár
</h1>


<p
  style="
    text-align:center;
    color:#777;
  "
>

  Vytvor si svoje nákupné zoznamy,
  vyber obchody a plánuj svoje nákupy.

</p>



<!-- =========================
     TLAČIDLÁ
========================== -->

<div
  style="
    display:grid;
    gap:10px;
    margin-top:25px;
  "
>


  <!-- PRIHLÁSENIE -->

  <button
    class="primary"
    type="button"
    onclick="goToLogin()"
  >

    🔐 Prihlásiť sa

  </button>



  <!-- REGISTRÁCIA -->

  <button
    class="secondary"
    type="button"
    onclick="goToRegister()"
  >

    📝 Registrovať sa

  </button>


</div>



<!-- STAV -->

<p
  id="loginStatus"
  style="
    text-align:center;
    color:#777;
    margin-top:20px;
    font-size:14px;
  "
>

  🔐 Prihlás sa alebo si vytvor nový účet.

</p>

===================================== --><script>

const firebaseConfig = {

/*
=========================================
  SPUSTENIE FIREBASE
=========================================
*/

if(
  !firebase.apps.length
){

  firebase.initializeApp(
    firebaseConfig
  );

const auth =
  firebase.auth();


const database =
  firebase.database();

     FIREBASE AUTH
===================================== --><script src="js/auth.js"></script><script>


/*
=========================================
  PRECHOD NA PRIHLÁSENIE
=========================================
*/

function goToLogin(){

  window.location.href =
    "login.html";

}



/*
=========================================
  PRECHOD NA REGISTRÁCIU
=========================================
*/

function goToRegister(){

  window.location.href =
    "register.html";

}



/*
=========================================
  KONTROLA PRIHLÁSENÉHO POUŽÍVATEĽA
=========================================

  Ak je používateľ prihlásený cez Firebase,
  automaticky ho presmerujeme do app.html.

*/

document.addEventListener(

  "DOMContentLoaded",

  function(){


    if(
      typeof auth === "undefined"
    ){

      return;

    }


    auth.onAuthStateChanged(

      function(user){


        if(user){


          const status =
            document.getElementById(
              "loginStatus"
            );


          if(status){

            status.textContent =
              "✅ Už si prihlásený. Otváram aplikáciu...";

          }


          setTimeout(

            function(){

              window.location.href =
                "app.html";

            },

            300

          );


        }


      }

    );


  }

);


</script>
