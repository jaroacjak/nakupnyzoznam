<!DOCTYPE html>
<html lang="sk">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>🛒 Nákupný kalendár</title>


  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>


<body>


<div class="app">


  <section class="card">


    <h1>
      🛒 Nákupný kalendár
    </h1>


    <p
      style="
        text-align:center;
        color:#777;
      "
    >

      Vytvor si svoje nákupné zoznamy,
      vyber obchody a plánuj svoje nákupy.

    </p>



    <!-- =========================
         TLAČIDLÁ
    ========================== -->

    <div
      style="
        display:grid;
        gap:10px;
        margin-top:25px;
      "
    >


      <!-- PRIHLÁSENIE -->

      <button
        class="primary"
        type="button"
        onclick="goToLogin()"
      >

        🔐 Prihlásiť sa

      </button>



      <!-- REGISTRÁCIA -->

      <button
        class="secondary"
        type="button"
        onclick="goToRegister()"
      >

        📝 Registrovať sa

      </button>


    </div>



    <!-- STAV -->

    <p
      id="loginStatus"
      style="
        text-align:center;
        color:#777;
        margin-top:20px;
        font-size:14px;
      "
    >

      🔐 Prihlás sa alebo si vytvor nový účet.

    </p>


  </section>


</div>



<!-- =====================================
     APPWRITE SDK
===================================== -->

<script src="https://cdn.jsdelivr.net/npm/appwrite@17.0.0"></script>



<!-- =====================================
     APPWRITE AUTH
===================================== -->

<script src="js/auth.js"></script>



<script>


/*
=========================================
  PRECHOD NA PRIHLÁSENIE
=========================================
*/

function goToLogin(){

  window.location.href =
    "login.html";

}



/*
=========================================
  PRECHOD NA REGISTRÁCIU
=========================================
*/

function goToRegister(){

  window.location.href =
    "register.html";

}



/*
=========================================
  KONTROLA PRIHLÁSENÉHO POUŽÍVATEĽA
=========================================

  Ak je používateľ prihlásený cez Appwrite,
  automaticky ho presmerujeme do app.html.

*/

document.addEventListener(

  "DOMContentLoaded",

  async function(){


    try{


      if(
        typeof getCurrentUser !== "function"
      ){

        return;

      }


      const user =
        await getCurrentUser();



      if(user){


        window.location.href =
          "app.html";


      }


    }catch(error){


      console.log(
        "Používateľ nie je prihlásený."
      );


    }


  }

);


</script>


</body>

</html>
