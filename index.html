<!DOCTYPE html>
<html lang="sk">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>🛒 Nákupný kalendár</title>


  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>


<body>


<div class="app">


  <section class="card">


    <h1>
      🛒 Nákupný kalendár
    </h1>


    <p
      style="
        text-align:center;
        color:#777;
      "
    >

      Vytvor si svoje nákupné zoznamy,
      vyber obchody a plánuj svoje nákupy.

    </p>



    <!-- ============================
         PRIHLÁSENIE A REGISTRÁCIA
    ============================= -->

    <div
      id="authButtons"
      style="
        display:grid;
        gap:10px;
        margin-top:25px;
      "
    >


      <button
        class="primary"
        onclick="window.location.href='login.html'"
      >

        🔐 Prihlásiť sa

      </button>



      <button
        class="secondary"
        onclick="window.location.href='register.html'"
      >

        📝 Registrovať sa

      </button>


    </div>



    <!-- ============================
         STAV PRIHLÁSENIA
    ============================= -->

    <p
      id="loginStatus"
      style="
        text-align:center;
        color:#777;
        margin-top:20px;
        font-size:14px;
      "
    >

      Kontrolujem prihlásenie...

    </p>


  </section>


</div>



<!-- =====================================
     APPWRITE SDK
===================================== -->

<script src="https://cdn.jsdelivr.net/npm/appwrite@17.0.0"></script>



<!-- =====================================
     AUTENTIFIKÁCIA
===================================== -->

<script src="js/auth.js"></script>



<script>


/*
=========================================
  KONTROLA PRIHLÁSENIA
=========================================
*/

document.addEventListener(

  "DOMContentLoaded",

  async function(){


    const status =

      document.getElementById(
        "loginStatus"
      );



    const authButtons =

      document.getElementById(
        "authButtons"
      );



    try{


      /*
      -----------------------------------
        KONTROLA APPWRITE POUŽÍVATEĽA
      -----------------------------------
      */

      const user =

        await getCurrentUser();



      /*
      -----------------------------------
        AK JE PRIHLÁSENÝ
      -----------------------------------
      */

      if(user){


        /*
          Skryjeme tlačidlá
        */

        authButtons.style.display =
          "none";



        /*
          MENO POUŽÍVATEĽA

          Ak nemá meno,
          použije sa e-mail.
        */

        const userName =

          user.name ||
          user.email ||
          "používateľ";



        status.innerHTML =

          "🟢 Prihlásený ako <b>"
          +
          userName
          +
          "</b><br><br>"
          +
          "Otváram aplikáciu...";



        /*
        ---------------------------------
          PRESMEROVANIE DO APP
        ---------------------------------
        */

        setTimeout(

          function(){

            window.location.href =
              "app.html";

          },

          800

        );


      }


      /*
      -----------------------------------
        AK NIE JE PRIHLÁSENÝ
      -----------------------------------
      */

      else{


        status.textContent =

          "🔐 Prihlás sa alebo si vytvor nový účet.";


      }


    }


    catch(error){


      console.error(
        "Chyba kontroly prihlásenia:",
        error
      );


      status.textContent =

        "🔐 Prihlás sa alebo si vytvor nový účet.";


    }


  }

);


</script>


</body>

</html>
